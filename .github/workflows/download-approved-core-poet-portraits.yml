name: Download approved 45 core poet portrait originals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/download-approved-core-poet-portraits.yml'
      - 'data/core-poet-portraits-allowlist-v2.json'
      - 'SOURCE_LIBRARY/tools/download_approved_core_poet_portraits.py'
      - 'requirements/source-audit.txt'

permissions:
  contents: read

concurrency:
  group: approved-core-poet-portraits-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  download-and-verify:
    name: Download five approved references for each of nine poets
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact allowlist and downloader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements/source-audit.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/source-audit.txt

      - name: Validate allowlist contract
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          path = Path('data/core-poet-portraits-allowlist-v2.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          records = data['records']
          counts = Counter(row['poetKey'] for row in records)
          assert data['schemaVersion'] == 2
          assert len(records) == 45
          assert len(counts) == 9 and set(counts.values()) == {5}
          assert len({row['commonsTitle'] for row in records}) == 45
          assert all(row['reviewDecision'] == 'APPROVED_REFERENCE' for row in records)
          PY

      - name: Recheck rights and download 45 originals
        run: >-
          python SOURCE_LIBRARY/tools/download_approved_core_poet_portraits.py
          --output approved-core-poet-portraits-45
          --max-file-mb 100
          --pause 0.25

      - name: Publish summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open('approved-core-poet-portraits-45/manifest.json', encoding='utf-8'))
          print('# Approved core poet portraits')
          print(f"- allowlist: `{data['allowlist']}`")
          print(f"- allowlist sha256: `{data['allowlist_sha256']}`")
          print(f"- selected: **{data['selected']}**")
          print(f"- downloaded: **{data['downloaded']}**")
          print(f"- total bytes: **{data['total_bytes']}**")
          print(f"- by poet: `{data['counts_by_poet']}`")
          print(f"- licenses: `{data['license_counts']}`")
          print('- publication approved: **false**')
          PY

      - name: Build ZIP by poet
        run: |
          root='approved-core-poet-portraits-45'
          mkdir -p "$root/packages"
          for dir in "$root"/0[1-9]_*; do
            [ -d "$dir" ] || continue
            base=$(basename "$dir")
            zip -q -r "$root/packages/$base.zip" "$dir"
          done

      - name: Upload portrait packages
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: approved-core-poet-portraits-45
          path: |
            approved-core-poet-portraits-45/packages/
            approved-core-poet-portraits-45/manifest.json
            approved-core-poet-portraits-45/manifest.csv
            approved-core-poet-portraits-45/SHA256SUMS.txt
            approved-core-poet-portraits-45/README.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Ensure downloader was read-only
        run: git diff --exit-code
