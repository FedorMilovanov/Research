name: Download approved 45 core poet portrait originals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/download-approved-core-poet-portraits.yml'
      - 'SOURCE_LIBRARY/tools/download_approved_core_poet_portraits.py'
      - 'SOURCE_LIBRARY/processed/APPROVED_CORE_POET_PORTRAITS_45_ALLOWLIST_2026-07-30.md'

permissions:
  contents: read

concurrency:
  group: approved-core-poet-portraits-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  download-and-verify:
    name: Download five approved references for each of nine poets
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Recheck rights and download 45 originals
        run: >-
          python SOURCE_LIBRARY/tools/download_approved_core_poet_portraits.py
          --output approved-core-poet-portraits-45
          --max-file-mb 100
          --pause 0.25

      - name: Publish summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open('approved-core-poet-portraits-45/manifest.json', encoding='utf-8'))
          print('# Approved core poet portraits')
          print(f"- selected: **{data['selected']}**")
          print(f"- downloaded: **{data['downloaded']}**")
          print(f"- total bytes: **{data['total_bytes']}**")
          print(f"- by poet: `{data['counts_by_poet']}`")
          print(f"- licenses: `{data['license_counts']}`")
          print(f"- statuses: `{data['status_counts']}`")
          PY

      - name: Build ZIP by poet
        shell: bash
        run: |
          root='approved-core-poet-portraits-45'
          mkdir -p "$root/packages"
          for dir in "$root"/0[1-9]_*; do
            [ -d "$dir" ] || continue
            base=$(basename "$dir")
            zip -q -r "$root/packages/$base.zip" "$dir"
          done

      - name: Upload poet ZIPs 01-03
        uses: actions/upload-artifact@v4
        with:
          name: approved-core-poet-portraits-01-03
          path: |
            approved-core-poet-portraits-45/packages/01_esenin.zip
            approved-core-poet-portraits-45/packages/02_bunin.zip
            approved-core-poet-portraits-45/packages/03_severyanin.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload poet ZIPs 04-06
        uses: actions/upload-artifact@v4
        with:
          name: approved-core-poet-portraits-04-06
          path: |
            approved-core-poet-portraits-45/packages/04_balmont.zip
            approved-core-poet-portraits-45/packages/05_tyutchev.zip
            approved-core-poet-portraits-45/packages/06_maykov.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload poet ZIPs 07-09
        uses: actions/upload-artifact@v4
        with:
          name: approved-core-poet-portraits-07-09
          path: |
            approved-core-poet-portraits-45/packages/07_bryusov.zip
            approved-core-poet-portraits-45/packages/08_blok.zip
            approved-core-poet-portraits-45/packages/09_fet.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload manifest and rights ledger
        uses: actions/upload-artifact@v4
        with:
          name: approved-core-poet-portraits-manifest
          path: |
            approved-core-poet-portraits-45/manifest.json
            approved-core-poet-portraits-45/manifest.csv
            approved-core-poet-portraits-45/SHA256SUMS.txt
            approved-core-poet-portraits-45/README.md
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
