name: Download approved 45 core poet portrait originals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/download-approved-core-poet-portraits.yml'
      - 'data/core-poet-portraits-allowlist-v2.json'
      - 'data/artifact-custody-policy-v2.json'
      - 'SOURCE_LIBRARY/tools/download_approved_core_poet_portraits.py'
      - 'requirements/source-audit.lock'

permissions:
  contents: read

jobs:
  download-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements/source-audit.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/source-audit.lock
      - name: Validate allowlist contract
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          data = json.loads(Path('data/core-poet-portraits-allowlist-v2.json').read_text(encoding='utf-8'))
          records = data['records']
          counts = Counter(row['poetKey'] for row in records)
          assert data['schemaVersion'] == 2
          assert len(records) == 45
          assert len(counts) == 9 and set(counts.values()) == {5}
          assert len({row['commonsTitle'] for row in records}) == 45
          assert all(row['reviewDecision'] == 'APPROVED_REFERENCE' for row in records)
          PY
      - name: Recheck rights and download 45 originals
        run: python SOURCE_LIBRARY/tools/download_approved_core_poet_portraits.py --output approved-core-poet-portraits-45 --max-file-mb 100 --pause 0.25
      - name: Enforce results and record custody
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('approved-core-poet-portraits-45')
          data = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          if data['selected'] != 45 or data['downloaded'] != 45:
              raise SystemExit(f"portrait acquisition gate failed: {data['downloaded']}/{data['selected']}")
          (root / 'CUSTODY.json').write_text(json.dumps({
              'state': 'EPHEMERAL_ACTION_ARTIFACT',
              'publicationEligible': False,
              'identityReviewCompletedForReference': True,
              'routeLevelIdentityReviewRequired': True,
              'itemLevelRightsRechecked': True,
              'retentionDays': 7,
              'durableReceiptPresent': False,
              'policy': 'data/artifact-custody-policy-v2.json'
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Build ZIP by poet and reproducibility witnesses
        run: |
          root='approved-core-poet-portraits-45'
          mkdir -p "$root/packages"
          for dir in "$root"/0[1-9]_*; do
            [ -d "$dir" ] || continue
            base=$(basename "$dir")
            zip -q -r "$root/packages/$base.zip" "$dir"
          done
          git rev-parse HEAD > "$root/RESEARCH_COMMIT.txt"
          python -m pip freeze > "$root/PIP_FREEZE.txt"
          sha256sum requirements/source-audit.lock > "$root/DEPENDENCY_LOCK_SHA256.txt"
      - name: Upload temporary portrait packages
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ephemeral-approved-core-poet-portraits-45
          path: approved-core-poet-portraits-45/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Ensure downloader is read-only
        run: git diff --exit-code
