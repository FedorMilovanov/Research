name: Heart P0 architecture dossiers

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/heart-p0-dossiers.yml'
      - 'data/heart-p0-architecture-dossiers-2026-08-02.json'
      - 'scripts/validate_heart_p0_dossiers.py'
      - 'scripts/check_heart_source_closure.py'
      - 'СЕРИЯ СЕРДЦЕ/00_CURRENT_AUTHORITY_2026-08-01.md'
      - 'СЕРИЯ СЕРДЦЕ/00_CURRENT_AUTHORITY_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/61_BOOK_ARCHITECTURE_V2_CHAPTERS_AND_RESEARCH_TASKS.md'
      - 'СЕРИЯ СЕРДЦЕ/74_SOURCE_CLOSURE_REGISTRY_2026-08-01.json'
      - 'СЕРИЯ СЕРДЦЕ/75_P0_EDEN_HEART_CREATED_AND_FALLEN_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/76_P0_BROKEN_HEART_REPENTANCE_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/77_P0_JUDGMENT_TWO_RESURRECTIONS_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/78_P0_ARCHITECTURE_CLOSURE_OVERLAY_2026-08-02.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/heart-p0-dossiers.yml'
      - 'data/heart-p0-architecture-dossiers-2026-08-02.json'
      - 'scripts/validate_heart_p0_dossiers.py'
      - 'scripts/check_heart_source_closure.py'
      - 'СЕРИЯ СЕРДЦЕ/00_CURRENT_AUTHORITY_2026-08-01.md'
      - 'СЕРИЯ СЕРДЦЕ/00_CURRENT_AUTHORITY_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/61_BOOK_ARCHITECTURE_V2_CHAPTERS_AND_RESEARCH_TASKS.md'
      - 'СЕРИЯ СЕРДЦЕ/74_SOURCE_CLOSURE_REGISTRY_2026-08-01.json'
      - 'СЕРИЯ СЕРДЦЕ/75_P0_EDEN_HEART_CREATED_AND_FALLEN_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/76_P0_BROKEN_HEART_REPENTANCE_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/77_P0_JUDGMENT_TWO_RESURRECTIONS_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/78_P0_ARCHITECTURE_CLOSURE_OVERLAY_2026-08-02.md'

permissions:
  contents: read

concurrency:
  group: heart-p0-dossiers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete Research history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compile Heart validators
        run: |
          python3 -m py_compile \
            scripts/check_heart_source_closure.py \
            scripts/validate_heart_p0_dossiers.py

      - name: Preserve R1-R9 source closure
        run: python3 scripts/check_heart_source_closure.py

      - name: Validate three P0 architecture dossiers
        run: python3 scripts/validate_heart_p0_dossiers.py

      - name: Ensure validators are read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
