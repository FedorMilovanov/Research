name: Apply Gost v130 JBC control

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == '[automation] apply Gost v130 JBC control'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply grouped and ledger delta
        id: apply
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/gost-v130.log 2>&1
          from pathlib import Path
          import csv

          ROOT = Path('БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED')
          HISTORY = ROOT / 'groups/02_HISTORY_NARRATIVE.md'
          PERIODICALS = ROOT / 'groups/03_PERIODICAL_CORPUS.md'
          LEDGERS = ROOT / 'groups/06_DATA_AND_PROOF_LEDGERS.md'
          README = ROOT / 'README.md'
          DATA = ROOT / 'data'

          def append_once(path, marker, block):
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  print('already present:', marker)
                  return
              path.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')
              print('appended:', marker)

          def upsert_csv(path, key_fields, records):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  fields = reader.fieldnames or []
                  rows = list(reader)
              for record in records:
                  key_field = next((k for k in key_fields if record.get(k)), None)
                  if not key_field:
                      raise SystemExit(f'{path}: record lacks key')
                  key = record[key_field]
                  matches = [r for r in rows if any(r.get(k) == key for k in key_fields)]
                  if len(matches) > 1:
                      raise SystemExit(f'{path}: duplicate key {key}')
                  clean = {k: v for k, v in record.items() if k in fields}
                  if matches:
                      matches[0].update(clean)
                      print('updated', path.name, key)
                  else:
                      row = {f: '' for f in fields}; row.update(clean); rows.append(row)
                      print('added', path.name, key)
              with path.open('w', encoding='utf-8-sig', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\r\n')
                  writer.writeheader(); writer.writerows(rows)

          append_once(HISTORY, '## v130 — JBC 1937–1939: citation routing and congress-number control', r'''
          ## v130 — JBC 1937–1939: citation routing and congress-number control

          ### Edition 680475 must not be cited as 1938 №2

          Official Jagiellonian Digital Library metadata identifies edition `680475` as **R.4, nr 5 (grudzień 1937)**. The IPN study's footnotes 95–96 point to that same edition but label it `1938, nr 2`; the official JBC object for **R.5, nr 2 (październik 1938)** is edition `680477`. This is preserved as a `CITATION_MAPPING_CONFLICT`, not silently corrected inside the scholar's prose. Event/page claims routed through those footnotes must be checked against the actual pages before use.

          ### 1937 congress numbering remains unresolved

          The IPN narrative calls the Warsaw meeting of 15–19 May 1937 the jubilee **10th congress**. The April 1939 primary issue reproduces a Ministry notice stating that the board was elected on 18 May 1937 at the **XI congress**; the same issue announces the **XII congress** for 28–30 May 1939. Therefore the repository now carries:

          `CONGRESS NUMBERING CONFLICT — SCHOLARLY 10TH VS PRIMARY NOTICE XI; XII ANNOUNCED FOR 1939`.

          Possible explanations (different counting conventions, an extraordinary congress, or a secondary numbering slip) are hypotheses only. Congress minutes or annual reports are required before normalization.

          ### Husaruk and legal-organizational boundary

          On p.24 the Kupsch quotation prints `W. Fetler ... (Husaruk)`. The parenthesis is evidence of an association/correction in the 1939 polemic, but it does not by itself establish Husaruk's office. `HUSARUK ROLE HOLD` remains. On pp.25–27 the issue explicitly replaces personal “groups” with the legalized Union and Mutual Aid Association, names `ks. L. Jesakow` at the head of the latter, and describes the two bodies as independent religious associations joined in a coordinating Community.
          ''')

          append_once(PERIODICALS, '## v130 — `Ewangeliczny Chrześcijanin` April 1939 page map', r'''
          ## v130 — `Ewangeliczny Chrześcijanin` April 1939 page map

          **Object:** JBC edition `680480`, R.6, nr 1 (April 1939), official 32-page PDF.  
          **Status:** `PRIMARY PAGE-MAPPED TEXT LAYER — VISUAL SCREENSHOT PENDING`; this is a control periodical, not an issue/continuation of `Гость`.

          | printed page | controlled use | gate |
          |---:|---|---|
          | 23–24 | title of the Kupsch rebuttal; quotation of the four-group scheme; wording `W. Fetler ... (Husaruk)` | exact quotation requires visual card |
          | 25 | source chain: Świątkowski 1937, March 1937 issue, Russian ministerial decisions of 25 Jan/15 Feb 1905, `Zwiastun Ewangeliczny`, Swiss church press, Russian 1909 press; legal correction of the Union/Association and Jesakow | source leads are not yet all inspected |
          | 26–27 | component statistics for Union and Association; printed totals; statement that they are two independent associations coordinated in the Community | preserve `27,383/27,380` and `401/400` conflicts |
          | 28 | announcement of XII congress for 28–30 May 1939 in Równe | visual check pending |
          | 31 | unnamed-society warning; reproduced MWRiOP notice dated 26 Jan 1939, address Szeroka 26, board elected 18 May 1937 at XI congress | statute-approval date is OCR-garbled and must not be normalized |

          ### Official-object correction

          JBC edition `680475` is December 1937 №5. IPN footnotes calling that object 1938 №2 are a routing error; official October 1938 №2 is edition `680477`.
          ''')

          append_once(LEDGERS, '## v130 — JBC citation and visual-proof delta', r'''
          ## v130 — JBC citation and visual-proof delta

          | ID | item | new status | what is proved | still blocked |
          |---|---|---|---|---|
          | `GOST-130-001` | JBC April 1939 №1 | `primary_text_page_mapped_visual_pending` | pp.23–28 and 31 mapped to Kupsch/Husaruk, source chain, legal correction, statistics, congress notice and ministry notice | screenshots/page cards |
          | `GOST-130-002` | JBC edition 680475 | `official_metadata_citation_conflict` | official object = Dec 1937 №5; IPN labels same edition 1938 №2 | cited content pages must be inspected before reassignment |
          | `GOST-130-003` | May 1937 congress | `numbering_conflict_unresolved` | IPN = 10th; reproduced ministry notice = XI; April 1939 announces XII | congress minutes/counting convention |
          | `GOST-130-004` | `Воскресная школа` | `secondary_series_record_official_holding_not_located` | appendix existed in 1934; secondary records repeat 24 issues with conflicting start year | no official issue-level shelfmark/file found; Gusaruk role remains HOLD |

          **No upgrade:** parsed PDF text is not `quote_ready`; failed screenshot retrieval is recorded as a visual blocker, not ignored.
          ''')

          append_once(README, '## v130 update — JBC citation routing and congress numbering', r'''
          ## v130 update — JBC citation routing and congress numbering

          - Added a page map for the April 1939 JBC control issue without importing it into the `Гость` corpus.
          - Corrected source routing: edition 680475 is December 1937 №5, not 1938 №2.
          - Preserved the 1937 congress-number conflict (10th / XI; XII announced for 1939) as unresolved.
          - Kept Husaruk and `Воскресная школа` editorship/holding claims behind their existing evidence gates.
          ''')

          upsert_csv(DATA / 'SOURCE_ANCHORS.csv', ['source_id', 'id'], [
              {
                  'source_id':'GOST-129-SRC-JBC1939','id':'',
                  'url':'https://jbc.bj.uj.edu.pl/dlibra/publication/718058/edition/680480',
                  'confirms':'page-mapped organization boundary; component statistics; XI/XII congress notices; unnamed-rival warning',
                  'source':'JBC edition 680480','authority_level':'A','used_for':'Gost organizational and citation control',
                  'version':'v130','source_key':'GOST-129-SRC-JBC1939','use':'reference control only',
                  'label':'JBC April 1939','type':'primary periodical issue',
                  'trust_note':'pp.23-28 and 31 text-layer mapped; screenshots/visual cards pending; not Gost',
                  'source_type':'official primary periodical',
                  'note':'preserve 27,383/27,380; 401/400; Husaruk HOLD; OCR-garbled statute date'
              },
              {
                  'source_id':'GOST-130-SRC-JBC680475','id':'',
                  'url':'https://jbc.bj.uj.edu.pl/en/dlibra/publication/718053/edition/680475/ewangeliczny-chrzescijanin-organ-zwiazku-slowianskich-zborow-ewangelicznych-chrzescijan-w-polsce-r-4-nr-5-grudzien-1937',
                  'confirms':'official object identity: R.4 no.5 December 1937; conflicts with IPN 1938 no.2 label',
                  'source':'JBC edition 680475','authority_level':'A-metadata','used_for':'citation routing correction',
                  'version':'v130','source_key':'GOST-130-SRC-JBC680475','use':'official metadata control',
                  'label':'JBC Dec 1937 no.5','type':'official digital object metadata',
                  'trust_note':'object identity verified; content pages not re-attributed without inspection',
                  'source_type':'institutional metadata','note':'official 1938 no.2 is edition 680477'
              }
          ])

          upsert_csv(DATA / 'PROOF_STATUS_LEDGER.csv', ['item_id', 'id'], [
              {'item_id':'GOST-130-001','id':'','corpus':'Ewangeliczny Chrześcijanin control','issue':'April 1939 no.1 pp.23-28,31','status':'primary_text_page_mapped_visual_pending','pages':'23-28;31','holding':'JBC official PDF','source':'JBC edition 680480','next_action':'Visual page cards and screenshot verification','year':'1939','source_url':'https://jbc.bj.uj.edu.pl/Content/680480/0001_NDIGCZAS039838_110491233.pdf','verification_note':'Kupsch/Husaruk; source chain; Jesakow; statistics; XI/XII congress; warning/ministry notice','version':'v130'},
              {'item_id':'GOST-130-002','id':'','corpus':'Citation control','issue':'JBC edition 680475','status':'official_metadata_citation_conflict','holding':'JBC official metadata','source':'JBC + IPN footnotes 95-96','next_action':'Inspect exact cited pages before event reassignment','year':'1937-1938','source_url':'https://jbc.bj.uj.edu.pl/en/dlibra/publication/718053/edition/680475/ewangeliczny-chrzescijanin-organ-zwiazku-slowianskich-zborow-ewangelicznych-chrzescijan-w-polsce-r-4-nr-5-grudzien-1937','verification_note':'680475 is Dec 1937 no.5; IPN labels same object 1938 no.2; official 1938 no.2 is 680477','version':'v130'},
              {'item_id':'GOST-130-003','id':'','corpus':'Congress chronology','issue':'Warsaw May 1937','status':'numbering_conflict_unresolved','holding':'IPN narrative + JBC 1939 reproduced ministry notice','source':'IPN p.16; JBC 680480 pp.28,31','next_action':'Locate congress minutes and counting convention','year':'1937-1939','source_url':'https://jbc.bj.uj.edu.pl/Content/680480/0001_NDIGCZAS039838_110491233.pdf','verification_note':'IPN 10th; ministry notice XI on 18 May 1937; XII announced May 1939','version':'v130'},
              {'item_id':'GOST-130-004','id':'','corpus':'Воскресная школа','issue':'series holding search','status':'secondary_series_record_official_holding_not_located','holding':'No official issue-level record located in targeted catalogue search','source':'secondary Polish/Russian bibliographies + 1934 Gost covers','next_action':'Search bound parent volumes and printed union/library catalogues','year':'1933-1936 / older 1923-1936','source_url':'','verification_note':'Negative catalogue result is not proof of absence; 24-issue/start-year conflict and Gusaruk role remain HOLD','version':'v130'}
          ])

          upsert_csv(DATA / 'NEXT_MICROBATCH.csv', ['item'], [
              {'priority':'P0','item':'Visual-check JBC 1939 pp.23-28 and 31','goal':'Create visual page cards for Kupsch/Husaruk wording, Jesakow correction, statistics, XII notice and ministry XI notice','blocker':'Web screenshot cache failed; acquire/render PDF locally'},
              {'priority':'P0','item':'Resolve May 1937 congress numbering','goal':'Determine why the same meeting is called 10th and XI; verify XII sequence in 1939','blocker':'Congress minutes or annual reports not yet located'},
              {'priority':'P1','item':'Locate official Voskresnaia Shkola holding','goal':'Find shelfmark, earliest/final issue and binding relation to Gost; verify chronology and editor from primary colophon','blocker':'Targeted online catalogue search returned only secondary bibliography'}
          ])

          for p in (DATA/'SOURCE_ANCHORS.csv', DATA/'PROOF_STATUS_LEDGER.csv', DATA/'NEXT_MICROBATCH.csv'):
              with p.open(encoding='utf-8-sig', newline='') as f:
                  list(csv.DictReader(f))
          for p, marker in [(HISTORY,'## v130 — JBC 1937–1939'),(PERIODICALS,'## v130 — `Ewangeliczny Chrześcijanin`'),(LEDGERS,'## v130 — JBC citation'),(README,'## v130 update')]:
              if p.read_text(encoding='utf-8').count(marker) != 1:
                  raise SystemExit(f'unsafe marker count in {p}: {marker}')
          print('Gost v130 integration prepared successfully')
          PY
          status=$?
          cat /tmp/gost-v130.log
          echo "exit_status=$status" >> /tmp/gost-v130.log
          exit $status

      - name: Commit and push
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Research Integrator'
          git config user.email 'research-integrator@users.noreply.github.com'
          git add 'БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED'
          git diff --cached --check || true
          git commit -m 'research(baptists): add JBC citation and congress controls'
          git push origin HEAD:main

      - name: Post diagnostic log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          p=pathlib.Path('/tmp/gost-v130.log')
          body=p.read_text(errors='replace') if p.exists() else 'No apply log produced.'
          payload=json.dumps({'body':'```text\n'+body[-50000:]+'\n```'}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments", data=payload, method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          urllib.request.urlopen(req).read()
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Close successful trigger
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}" -d '{"state":"closed","state_reason":"completed"}'
