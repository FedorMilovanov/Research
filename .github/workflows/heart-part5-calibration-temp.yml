name: TEMP Heart Part V calibration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/heart-part5-calibration-temp.yml'
      - 'scripts/validate_heart_part5_native_citation_pass.py'
      - 'scripts/calibrate_heart_part5_dispositions_temp.py'

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout Research
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: Research
          persist-credentials: false
      - name: Checkout exact Product snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FedorMilovanov/gb-is-my-strength
          ref: 0fbe7d1ead9ebd1bea867418e254da438ec63329
          path: Product
          persist-credentials: false
      - name: Calibrate Part V native citation surfaces
        working-directory: Research
        continue-on-error: true
        run: python3 scripts/validate_heart_part5_native_citation_pass.py --product-root ../Product
      - name: Calibrate Part V role and URL dispositions
        working-directory: Research
        run: python3 scripts/calibrate_heart_part5_dispositions_temp.py --product-root ../Product
      - name: Prove read-only
        if: always()
        run: |
          git -C Research diff --exit-code
          test -z "$(git -C Research status --porcelain)"
          git -C Product diff --exit-code
          test -z "$(git -C Product status --porcelain)"
