name: Security baseline

# Единый защитный контур для этого репозитория: секреты и гигиена workflow.
#
# Почему две джобы по секретам, а не одна:
#   * `secrets` блокирует PR и push, если находка есть в новых коммитах;
#   * на расписании тот же прогон идёт по всей истории и НЕ блокирует, пока
#     исторические находки не разобраны. Красный гейт, который все игнорируют,
#     хуже отсутствующего: он приучает не смотреть на CI. После первого разбора
#     истории `continue-on-error` снимается — это отдельный осознанный шаг.
#
# Все внешние действия прибиты к полному 40-символьному SHA.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Понедельник, 04:23 UTC — недельный прогон по всей истории.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        # На расписании — обзор всей истории (не блокирует), на PR/push — блокирует.
        continue-on-error: ${{ github.event_name == 'schedule' }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Enforce pinned actions and declared permissions
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys

          errors = []
          sha = re.compile(r"@[0-9a-f]{40}$")
          files = sorted(pathlib.Path(".github/workflows").glob("*.y*ml"))

          for path in files:
              text = path.read_text(encoding="utf-8")
              for line in text.splitlines():
                  stripped = line.strip()
                  if not stripped.startswith("uses:"):
                      continue
                  # Отсекаем хвостовой комментарий вида " # v4": иначе якорь $ не сработает.
                  ref = stripped.split("uses:", 1)[1].split("#", 1)[0].strip().strip("'\"")
                  if ref.startswith("./"):
                      # Локальное действие или reusable workflow: фиксировано самим коммитом.
                      continue
                  if not sha.search(ref):
                      errors.append(f"{path}: action is not pinned to a 40-hex SHA: {ref}")
              if not re.search(r"^permissions:", text, re.M):
                  errors.append(f"{path}: no top-level permissions block")
              if re.search(r"permissions:\s*write-all", text):
                  errors.append(f"{path}: permissions write-all is forbidden")
              if "pull_request_target" in text and "head.repo.full_name == github.repository" not in text:
                  errors.append(f"{path}: pull_request_target without fork guard")

          index = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          forbidden = (".env", "cookies.txt", "client_secret.json", "credentials.json")
          for name in index:
              base = name.rsplit("/", 1)[-1]
              if base in forbidden or base.endswith((".pem", ".key", ".p12")):
                  errors.append(f"tracked secret-like file: {name}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK: {len(files)} workflow files, all external actions pinned, permissions declared")
          PY

      - name: Guard against secret-shaped strings in the last commit
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          patterns = [
              re.compile(r"AIza[0-9A-Za-z_-]{35}"),                 # Google API key
              re.compile(r"gh[pousr]_[0-9A-Za-z]{36}"),             # GitHub token
              re.compile(r"(?<!\d)\d{8,10}:[A-Za-z0-9_-]{35}"),     # Telegram bot token
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),    # private key
              re.compile(r"ya29\.[0-9A-Za-z_-]{20,}"),              # Google OAuth access token
          ]
          try:
              diff = subprocess.run(
                  ["git", "log", "-p", "-1", "--unified=0"],
                  capture_output=True, text=True, check=True, timeout=120
              ).stdout
          except Exception as exc:  # noqa: BLE001 - диагностика важнее формы
              print(f"skipped: {exc}")
              sys.exit(0)

          hits = []
          for line in diff.splitlines():
              if line.startswith("+") and not line.startswith("+++"):
                  for pattern in patterns:
                      if pattern.search(line):
                          hits.append(pattern.pattern)
          if hits:
              print("possible secret-shaped strings in the last commit: " + ", ".join(sorted(set(hits))))
              sys.exit(1)
          print("OK: no secret-shaped strings in the last commit")
          PY
