name: Reformation corpus integrity

on:
  pull_request:
    paths:
      - 'docs/research/reformation/**'
      - 'data/repository-evidence-policy-v2.json'
      - 'CURRENT_AUTHORITY.md'
      - 'AGENT_RULES.md'
      - '.github/workflows/reformation-corpus-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'docs/research/reformation/**'
      - 'data/repository-evidence-policy-v2.json'
      - 'CURRENT_AUTHORITY.md'
      - 'AGENT_RULES.md'
      - '.github/workflows/reformation-corpus-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Reformation evidence contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Validate Reformation source, claim, acquisition, and evidence integrity
        run: python3 -B docs/research/reformation/validate_corpus.py

      - name: Run reproducibility and failure-injection regression tests
        run: python3 -B -m unittest discover -s docs/research/reformation -p 'test_*.py' -v

      - name: Ensure checks leave the repository unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
