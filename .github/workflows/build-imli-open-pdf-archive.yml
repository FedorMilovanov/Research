name: Build IMLI open-access PDF archive

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-imli-open-pdf-archive.yml'
      - 'SOURCE_LIBRARY/tools/crawl_imli_open_pdfs.py'
      - 'SOURCE_LIBRARY/IMLI_40PLUS_PDF_PASS_2026-07-30.md'

permissions:
  contents: read

concurrency:
  group: imli-open-pdf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect-and-verify:
    name: Collect and verify 40+ IMLI PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Download current official IMLI Russian-literature PDFs
        run: >-
          python SOURCE_LIBRARY/tools/crawl_imli_open_pdfs.py
          --target 40
          --max-candidates 100
          --max-file-mb 350
          --output-root open-access-pdf-archive
          --pause 1.0

      - name: Enforce 40+ valid-PDF gate
        shell: bash
        run: |
          python - <<'PY' | tee aggregate-report.json
          import json
          from pathlib import Path

          manifest_path = Path('open-access-pdf-archive/ed-imli-russian-literature-40plus/manifest.json')
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          report = {
              'collection': data['collection'],
              'catalogue': data['catalogue'],
              'catalogue_pages_attempted': data['catalogue_pages_attempted'],
              'catalogue_page_failures': len(data['catalogue_page_failures']),
              'eligible_candidates_discovered': data['eligible_cc_by_nd_candidates_discovered'],
              'candidates_processed': data['candidates_processed'],
              'downloaded_pdfs': data['downloaded_pdfs'],
              'failed_or_skipped': data['failed_or_skipped'],
              'total_bytes': data['total_bytes'],
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report['eligible_candidates_discovered'] < 40:
              raise SystemExit('40+ discovery gate failed')
          if report['downloaded_pdfs'] < 40:
              raise SystemExit('40+ valid-PDF archive gate failed')
          PY

      - name: Publish workflow summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open('aggregate-report.json', encoding='utf-8'))
          print('# IMLI 40+ PDF pass')
          print(f"- official catalogue: {report['catalogue']}")
          print(f"- catalogue pages attempted: **{report['catalogue_pages_attempted']}**")
          print(f"- page failures: **{report['catalogue_page_failures']}**")
          print(f"- eligible CC BY-ND candidates: **{report['eligible_candidates_discovered']}**")
          print(f"- candidates processed: **{report['candidates_processed']}**")
          print(f"- valid PDFs downloaded: **{report['downloaded_pdfs']}**")
          print(f"- failed/skipped: **{report['failed_or_skipped']}**")
          print(f"- total bytes: **{report['total_bytes']}**")
          PY

      - name: Upload PDF archive with provenance and checksums
        uses: actions/upload-artifact@v4
        with:
          name: imli-open-pdf-russian-literature-40plus
          path: open-access-pdf-archive/ed-imli-russian-literature-40plus/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload lightweight audit package
        uses: actions/upload-artifact@v4
        with:
          name: imli-40plus-manifest-and-audit
          path: |
            open-access-pdf-archive/ed-imli-russian-literature-40plus/manifest.json
            open-access-pdf-archive/ed-imli-russian-literature-40plus/manifest.csv
            open-access-pdf-archive/ed-imli-russian-literature-40plus/SHA256SUMS.txt
            open-access-pdf-archive/ed-imli-russian-literature-40plus/README.md
            aggregate-report.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
