name: Build Commons Russian-literature strict open PDF archive

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-commons-russian-literature-open-pdf-archive.yml'
      - 'SOURCE_LIBRARY/tools/crawl_commons_open_pdfs.py'
      - 'SOURCE_LIBRARY/tools/crawl_commons_open_pdfs_search_api.py'
      - 'SOURCE_LIBRARY/tools/crawl_commons_strict_literary_pdfs.py'
      - 'SOURCE_LIBRARY/tools/crawl_commons_strict_literary_pdfs_v2.py'
      - 'SOURCE_LIBRARY/COMMONS_RUSSIAN_LITERATURE_40PLUS_PDF_PASS_2026-07-30.md'
      - 'requirements/source-audit.txt'
      - 'data/artifact-custody-policy-v2.json'

permissions:
  contents: read

concurrency:
  group: commons-strict-open-pdf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect-and-verify:
    name: Collect and verify 40+ strict literary PDFs
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact acquisition code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements/source-audit.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/source-audit.txt

      - name: Compile acquisition tools
        run: |
          python -m py_compile \
            SOURCE_LIBRARY/tools/crawl_commons_open_pdfs.py \
            SOURCE_LIBRARY/tools/crawl_commons_open_pdfs_search_api.py \
            SOURCE_LIBRARY/tools/crawl_commons_strict_literary_pdfs.py \
            SOURCE_LIBRARY/tools/crawl_commons_strict_literary_pdfs_v2.py

      - name: Discover and download strict literary PDFs
        run: >-
          python SOURCE_LIBRARY/tools/crawl_commons_strict_literary_pdfs_v2.py
          --target 40
          --per-query 30
          --max-candidates 300
          --max-file-mb 120
          --output-root open-access-pdf-archive
          --pause 0.7

      - name: Enforce strict corpus and write custody metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('open-access-pdf-archive/commons-russian-literature-strict-open-pdf-40plus')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          if manifest['eligible_open_pdf_candidates_discovered'] < 40:
              raise SystemExit('40+ strict discovery gate failed')
          if manifest['downloaded_pdfs'] < 40:
              raise SystemExit(f"40+ valid-PDF gate failed: {manifest['downloaded_pdfs']}")
          custody = {
              'state': 'EPHEMERAL_ACTION_ARTIFACT',
              'publicationEligible': False,
              'retentionDays': 7,
              'durableReceiptPresent': False,
              'policy': 'data/artifact-custody-policy-v2.json',
              'warning': 'Workflow output is temporary until a destination object ID and SHA-256 readback receipt are committed.'
          }
          (root / 'CUSTODY.json').write_text(json.dumps(custody, indent=2), encoding='utf-8')
          PY

      - name: Split PDF archive into connector-safe parts
        run: |
          root='open-access-pdf-archive/commons-russian-literature-strict-open-pdf-40plus'
          mkdir -p "$root/chunks/part-1" "$root/chunks/part-2" "$root/chunks/part-3" "$root/chunks/part-4"
          shopt -s nullglob
          for file in "$root"/[0-9][0-9]__*.pdf; do
            base=$(basename "$file")
            index=$((10#${base%%__*}))
            part=$(( (index - 1) / 10 + 1 ))
            mv "$file" "$root/chunks/part-$part/$base"
          done

      - name: Add reproducibility witnesses
        run: |
          root='open-access-pdf-archive/commons-russian-literature-strict-open-pdf-40plus'
          git rev-parse HEAD > "$root/RESEARCH_COMMIT.txt"
          python -m pip freeze > "$root/PIP_FREEZE.txt"

      - name: Upload temporary PDF package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ephemeral-commons-strict-literary-pdf-40plus
          path: open-access-pdf-archive/commons-russian-literature-strict-open-pdf-40plus/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Ensure acquisition code is read-only
        run: git diff --exit-code
