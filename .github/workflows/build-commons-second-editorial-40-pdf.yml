name: Build second editorial 40-PDF open archive

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-commons-second-editorial-40-pdf.yml'
      - 'SOURCE_LIBRARY/tools/crawl_commons_second_editorial_40_pdfs.py'
      - 'SOURCE_LIBRARY/SECOND_EDITORIAL_40_PDF_PASS_2026-07-30.md'
      - 'requirements/source-audit.lock'
      - 'data/artifact-custody-policy-v2.json'

permissions:
  contents: read

concurrency:
  group: commons-second-editorial-40-pdf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact acquisition code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements/source-audit.lock

      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/source-audit.lock

      - name: Compile acquisition tool
        run: python -m py_compile SOURCE_LIBRARY/tools/crawl_commons_second_editorial_40_pdfs.py

      - name: Discover, download and verify 40 PDFs
        run: >-
          python SOURCE_LIBRARY/tools/crawl_commons_second_editorial_40_pdfs.py
          --target 40
          --per-query 30
          --max-candidates 180
          --max-file-mb 120
          --pause 0.45
          --output-root second-editorial-pdf-archive

      - name: Enforce corpus and write custody metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('second-editorial-pdf-archive/commons-second-editorial-open-pdf-40')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          if manifest['downloaded_pdfs'] != 40:
              raise SystemExit(f"second editorial gate failed: {manifest['downloaded_pdfs']}/40")
          if manifest['discovery_failures']:
              raise SystemExit(f"discovery failures: {len(manifest['discovery_failures'])}")
          (root / 'CUSTODY.json').write_text(json.dumps({
              'state': 'EPHEMERAL_ACTION_ARTIFACT',
              'publicationEligible': False,
              'retentionDays': 7,
              'durableReceiptPresent': False,
              'policy': 'data/artifact-custody-policy-v2.json'
          }, indent=2), encoding='utf-8')
          PY

      - name: Add reproducibility witnesses
        run: |
          root='second-editorial-pdf-archive/commons-second-editorial-open-pdf-40'
          git rev-parse HEAD > "$root/RESEARCH_COMMIT.txt"
          python -m pip freeze > "$root/PIP_FREEZE.txt"
          sha256sum requirements/source-audit.lock > "$root/DEPENDENCY_LOCK_SHA256.txt"

      - name: Upload temporary PDF corpus
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ephemeral-second-editorial-40-pdf
          path: second-editorial-pdf-archive/commons-second-editorial-open-pdf-40/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Ensure acquisition code is read-only
        run: git diff --exit-code
