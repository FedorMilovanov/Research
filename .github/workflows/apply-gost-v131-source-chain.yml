name: Apply Gost v131 source chain

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: baptists-grouped-writes
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.issue.title == '[automation] apply Gost v131 source chain'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply against current main with bounded push retries
        id: apply
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/gost-v131.log
          success=0
          for attempt in 1 2 3 4; do
            echo "attempt=$attempt" | tee -a /tmp/gost-v131.log
            git fetch origin main >> /tmp/gost-v131.log 2>&1 || exit 1
            git reset --hard origin/main >> /tmp/gost-v131.log 2>&1 || exit 1
            python .github/scripts/apply_gost_v131_source_chain.py >> /tmp/gost-v131.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              cat /tmp/gost-v131.log
              exit "$status"
            fi
            git config user.name 'OpenAI Research Integrator'
            git config user.email 'research-integrator@users.noreply.github.com'
            git add -- \
              'БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED/groups/06_DATA_AND_PROOF_LEDGERS.md' \
              'БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED/data/SOURCE_ANCHORS.csv' \
              'БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED/data/PROOF_STATUS_LEDGER.csv' \
              'БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED/data/NEXT_MICROBATCH.csv'
            if git diff --cached --quiet; then
              echo 'No research changes required; exact v131 state already present.' | tee -a /tmp/gost-v131.log
              success=1
              break
            fi
            git diff --cached --check >> /tmp/gost-v131.log 2>&1 || exit 1
            git commit -m 'research(baptists): refine Gusaruk source chain and holding route v131' >> /tmp/gost-v131.log 2>&1 || exit 1
            if git push origin HEAD:main >> /tmp/gost-v131.log 2>&1; then
              success=1
              break
            fi
            echo 'push race detected; reapplying to fresh origin/main' | tee -a /tmp/gost-v131.log
          done
          cat /tmp/gost-v131.log
          if [ "$success" -ne 1 ]; then
            echo 'bounded retries exhausted' >&2
            exit 1
          fi

      - name: Post diagnostic log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          path = pathlib.Path('/tmp/gost-v131.log')
          body = path.read_text(errors='replace') if path.exists() else 'No integration log produced.'
          payload = json.dumps({'body': '```text\n' + body[-50000:] + '\n```'}).encode()
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments"
          request = urllib.request.Request(url, data=payload, method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
          })
          urllib.request.urlopen(request).read()
          PY

      - name: Close successful trigger
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}" \
            -d '{"state":"closed","state_reason":"completed"}'
