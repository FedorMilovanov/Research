# Disposable diagnostic workflow: remove after copying exact output of the unchanged official generator.
name: MAX scoped official atonement reshoot (temporary)
on:
  push:
    branches:
      - max/atonement-p22-active-first-eight-20261119
    paths:
      - .github/workflows/max-atonement-reshoot-temporary.yml
permissions:
  contents: read
jobs:
  reshoot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run unchanged official reshoot and checks
        run: |
          python3 -B scripts/atonement_reshoot_state.py --write
          python3 -B scripts/atonement_reshoot_state.py --check
          python3 -B scripts/atonement_sync_check.py
          python3 -B scripts/atonement_claim_register.py --check
      - name: Print only exact generated-file line edits for MAX integration
        run: |
          python3 - <<'PY'
          import difflib
          import json
          import pathlib
          import subprocess
          paths = [
              "ИСКУПЛЕНИЕ/18_SERIES_AUDIT_AND_ARCS_2026-10-26.md",
              "ИСКУПЛЕНИЕ/data/atonement-corpus-v1.json",
          ]
          report = {}
          for path in paths:
              old = subprocess.check_output(["git", "show", "HEAD:" + path]).decode("utf-8")
              new = pathlib.Path(path).read_text(encoding="utf-8")
              a, b = old.splitlines(keepends=True), new.splitlines(keepends=True)
              changes = []
              for tag, i1, i2, j1, j2 in difflib.SequenceMatcher(None, a, b, autojunk=False).get_opcodes():
                  if tag != "equal":
                      changes.append({"i1": i1, "i2": i2, "old": "".join(a[i1:i2]), "new": "".join(b[j1:j2])})
              report[path] = {"old_lines": len(a), "new_lines": len(b), "ops": changes}
          extra = subprocess.check_output(["git", "diff", "--name-only"]).decode("utf-8").splitlines()
          if sorted(extra) != sorted(paths):
              raise RuntimeError("official generator touched unexpected paths: " + str(extra))
          payload = json.dumps(report, ensure_ascii=True, separators=(",", ":"))
          print("MAX_RESHOOT_PAYLOAD_BEGIN")
          for i in range(0, len(payload), 2000):
              print("MAX_RESHOOT_CHUNK:" + payload[i:i+2000])
          print("MAX_RESHOOT_PAYLOAD_END")
          PY
