name: Official core acquisition 40plus

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SOURCE_LIBRARY/TOTAL_SOURCE_ACQUISITION_AUDIT_2026-07-30.md'
      - 'SOURCE_LIBRARY/tools/official_core_acquisition_40plus.py'
      - 'SOURCE_LIBRARY/tools/official_core_acquisition_40plus_v2.py'
      - 'requirements/source-audit.lock'
      - 'data/artifact-custody-policy-v2.json'
      - '.github/workflows/official-core-acquisition-40plus.yml'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements/source-audit.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/source-audit.lock
      - name: Compile acquisition tools
        run: python -m py_compile SOURCE_LIBRARY/tools/official_core_acquisition_40plus.py SOURCE_LIBRARY/tools/official_core_acquisition_40plus_v2.py
      - name: Run corrected rights-first acquisition pass
        env:
          MAX_FILE_BYTES: '367001600'
          MAX_TOTAL_BYTES: '1610612736'
        run: python SOURCE_LIBRARY/tools/official_core_acquisition_40plus_v2.py
      - name: Reject generic NEB app manifests
        run: |
          if grep -q 'neb-mayakovsky.*manifest.json' official-core-acquisition-output/download_manifest.csv; then
            echo 'Generic NEB app manifest was incorrectly accepted as a source object' >&2
            exit 1
          fi
      - name: Record custody and reproducibility
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('official-core-acquisition-output')
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          custody = {
              'state': 'EPHEMERAL_ACTION_ARTIFACT',
              'publicationEligible': False,
              'retentionDays': 7,
              'durableReceiptPresent': False,
              'rightsRemainDatasetSpecific': True,
              'policy': 'data/artifact-custody-policy-v2.json',
              'summary': summary
          }
          (root / 'CUSTODY.json').write_text(json.dumps(custody, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          git rev-parse HEAD > official-core-acquisition-output/RESEARCH_COMMIT.txt
          python -m pip freeze > official-core-acquisition-output/PIP_FREEZE.txt
          sha256sum requirements/source-audit.lock > official-core-acquisition-output/DEPENDENCY_LOCK_SHA256.txt
      - name: Upload temporary acquisition evidence and files
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ephemeral-official-core-acquisition-59-v2
          path: official-core-acquisition-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Ensure acquisition code is read-only
        run: git diff --exit-code
