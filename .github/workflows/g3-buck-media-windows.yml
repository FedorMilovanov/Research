name: G3 Buck bounded original-media windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - G3_HISTORY/tools/acquire_buck_media_windows.py
      - G3_HISTORY/requirements-media.lock
      - .github/workflows/g3-buck-media-windows.yml
  push:
    branches: [main]
    paths:
      - G3_HISTORY/tools/acquire_buck_media_windows.py
      - G3_HISTORY/requirements-media.lock
      - .github/workflows/g3-buck-media-windows.yml

permissions:
  contents: read

concurrency:
  group: g3-buck-media-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  G3_BUCK_MEDIA_OUT: g3-buck-media-evidence
  WHISPER_MODEL: base.en

jobs:
  acquire:
    strategy:
      fail-fast: false
      matrix:
        item: [11, 12, 13, 14, 15, 16, 17]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'

      - name: Install ffmpeg and pinned Python media tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check -r G3_HISTORY/requirements-media.lock
          ffmpeg -version | head -n 1
          python -m pip freeze | sort

      - name: Compile acquisition tool
        run: python -m py_compile G3_HISTORY/tools/acquire_buck_media_windows.py

      - name: Acquire bounded public FBC media windows
        run: |
          set -euo pipefail
          python G3_HISTORY/tools/acquire_buck_media_windows.py --item ${{ matrix.item }}

      - name: Assert no audio or video binary enters artifact
        run: |
          set -euo pipefail
          test -f "$G3_BUCK_MEDIA_OUT/item-$(printf '%02d' '${{ matrix.item }}')/ACQUISITION_RECEIPT.json"
          if find "$G3_BUCK_MEDIA_OUT" -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.mp4' -o -iname '*.webm' \) | grep -q .; then
            echo 'Unexpected media binary present in artifact staging' >&2
            exit 1
          fi

      - name: Record exact runtime provenance
        run: |
          set -euo pipefail
          d="$G3_BUCK_MEDIA_OUT/item-$(printf '%02d' '${{ matrix.item }}')"
          ffmpeg -version | head -n 1 > "$d/FFMPEG_VERSION.txt"
          python -m pip freeze | sort > "$d/PYTHON_DEPENDENCIES.txt"
          cat > "$d/GITHUB_PROVENANCE.txt" <<EOF
          repository=$GITHUB_REPOSITORY
          sha=$GITHUB_SHA
          checked_out_sha=$(git rev-parse HEAD)
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          workflow=$GITHUB_WORKFLOW
          item=${{ matrix.item }}
          authentication_used=false
          audio_binary_retained=false
          machine_transcript_only=true
          publication_authorized=false
          item_verified=false
          EOF

      - name: Upload transcript/custody evidence only
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: g3-buck-media-item-${{ matrix.item }}-${{ github.sha }}
          path: g3-buck-media-evidence/item-*/
          retention-days: 7
          if-no-files-found: error
