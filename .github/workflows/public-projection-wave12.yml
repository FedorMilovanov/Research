name: Public projection Wave 12

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-projection-wave12.yml'
      - 'scripts/validate_public_projection_wave12.py'
      - 'data/public-projection-current-2026-08-02.json'
      - 'data/public-projection-osk-wave6-overlay-2026-08-01.json'
      - 'PUBLIC_PROJECTION_CURRENT_AUTHORITY_2026-08-01.md'
      - '00_RESEARCH_CURRENT_AUTHORITY_2026-08-01.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-projection-wave12.yml'
      - 'scripts/validate_public_projection_wave12.py'
      - 'data/public-projection-current-2026-08-02.json'
      - 'data/public-projection-osk-wave6-overlay-2026-08-01.json'
      - 'PUBLIC_PROJECTION_CURRENT_AUTHORITY_2026-08-01.md'
      - '00_RESEARCH_CURRENT_AUTHORITY_2026-08-01.md'

permissions:
  contents: read

concurrency:
  group: public-projection-wave12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Research
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate Python syntax without writing bytecode
        run: >-
          python3 -c 'from pathlib import Path; p=Path("scripts/validate_public_projection_wave12.py"); compile(p.read_text(encoding="utf-8"), str(p), "exec")'

      - name: Recompose and validate current source projection
        run: python3 scripts/validate_public_projection_wave12.py

      - name: Ensure validator is read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
