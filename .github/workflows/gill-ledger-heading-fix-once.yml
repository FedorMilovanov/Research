name: One-shot Gill ledger heading fix

on:
  push:
    branches:
      - agent/gill-primary-source-closure-2026-07-24

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gill-primary-source-closure-2026-07-24
      - name: Correct section inventory
        shell: python
        run: |
          from pathlib import Path
          p = Path('Джон Гилл/72_PRIMARY_SOURCE_40_PLUS_DIRECT_LINK_LEDGER_AND_CLOSURE.md')
          s = p.read_text(encoding='utf-8')
          old = '# III. Исповедания и Salters’ Hall: 8 первичных точек'
          new = '# III. Исповедания и Salters’ Hall: 9 контрольных точек'
          if old not in s:
              raise SystemExit('expected heading not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Self-remove and commit
        run: |
          git rm .github/workflows/gill-ledger-heading-fix-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(gill): correct Salters Hall ledger inventory'
          git push origin HEAD:agent/gill-primary-source-closure-2026-07-24
