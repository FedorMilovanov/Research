name: Apply consolidated Gost and Fetler evidence

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == '[automation] apply Gost Fetler v129d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden live authority-row replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/scripts/apply_gost_v129.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('# Critical person-authority correction.')
          end = text.index("append_once(HISTORY,", start)
          replacement = '''# Critical person-authority correction.\ntext = HISTORY.read_text(encoding='utf-8')\nnew = """| **В. А. Фетлер (Вильгельм / William)** | 1883–1957 (RSL authority records) | surname pool not yet disambiguated | St Petersburg/Riga evangelist, author, compiler and publishing organizer; `Вера`, `Гость`, legal and devotional booklet network |\n| **Р. А. Фетлер (Роберт / Robert)** | 1892–1941 (family archive strong; exact LVA file 1987/1/13296 located, contents pending) | surname pool not yet disambiguated | Omsk/Vladivostok pastor and editor-publisher of `Благовестник`; distinct younger brother of William |"""\nif '## v129 — `Гость` и Фетлеры: консолидированный H–L delta' not in text:\n    pattern = re.compile(r'^\\| \\*\\*Р\\.\\s*А\\.\\s*Фетлер\\*\\* \\|[^\\n]*$', re.MULTILINE)\n    matches = pattern.findall(text)\n    if len(matches) != 1:\n        raise SystemExit(f'unsafe live Fetler row count: {len(matches)}')\n    text = pattern.sub(new, text, count=1)\n    HISTORY.write_text(text, encoding='utf-8')\n    print('replaced conflated Fetler authority row by regex')\n\n'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Apply research integration
        run: python .github/scripts/apply_gost_v129.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          root='БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED'
          grep -Fq '## v129 — `Гость` и Фетлеры: консолидированный H–L delta' "$root/groups/02_HISTORY_NARRATIVE.md"
          grep -Fq '## v129 — `Гость`: контрольный корпус, издательская сеть и новые holdings' "$root/groups/03_PERIODICAL_CORPUS.md"
          grep -Fq '## v129 — `Гость` / Фетлеры: consolidated proof ledger' "$root/groups/06_DATA_AND_PROOF_LEDGERS.md"
          test "$(grep -Foc 'Р. А. Фетлер** | 1861–1933' "$root/groups/02_HISTORY_NARRATIVE.md" || true)" = 0
          git diff --check

      - name: Commit and push Research files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Research Integrator'
          git config user.email 'research-integrator@users.noreply.github.com'
          git add 'БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED'
          git commit -m 'research(baptists): integrate Gost and split Fetler authorities'
          git push origin HEAD:main

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}" \
            -d '{"state":"closed","state_reason":"completed"}'
