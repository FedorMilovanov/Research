name: Apply consolidated Gost and Fetler evidence

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == '[automation] apply Gost Fetler v129c'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply research integration
        run: python .github/scripts/apply_gost_v129.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          root='БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED'
          grep -Fq '## v129 — `Гость` и Фетлеры: консолидированный H–L delta' "$root/groups/02_HISTORY_NARRATIVE.md"
          grep -Fq '## v129 — `Гость`: контрольный корпус, издательская сеть и новые holdings' "$root/groups/03_PERIODICAL_CORPUS.md"
          grep -Fq '## v129 — `Гость` / Фетлеры: consolidated proof ledger' "$root/groups/06_DATA_AND_PROOF_LEDGERS.md"
          test "$(grep -Foc 'Р. А. Фетлер** | 1861–1933' "$root/groups/02_HISTORY_NARRATIVE.md" || true)" = 0
          git diff --check

      - name: Commit and push Research files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Research Integrator'
          git config user.email 'research-integrator@users.noreply.github.com'
          git add 'БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED'
          git commit -m 'research(baptists): integrate Gost and split Fetler authorities'
          git push origin HEAD:main

      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}" \
            -d '{"state":"closed","state_reason":"completed"}'
