name: Apply consolidated Gost and Fetler evidence

on:
  push:
    paths:
      - '.github/workflows/apply-gost-fetler-consolidation.yml'

permissions:
  contents: write

concurrency:
  group: apply-gost-fetler-consolidation
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply no-loss consolidated update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import re

          root = Path('БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED')
          history = root / 'groups/02_HISTORY_NARRATIVE.md'
          periodicals = root / 'groups/03_PERIODICAL_CORPUS.md'
          ledgers = root / 'groups/06_DATA_AND_PROOF_LEDGERS.md'
          readme = root / 'README.md'

          for p in (history, periodicals, ledgers, readme):
              if not p.exists():
                  raise SystemExit(f'missing required grouped file: {p}')

          def append_once(path: Path, marker: str, block: str) -> None:
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  print(f'skip existing marker {marker}: {path}')
                  return
              path.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')
              print(f'appended {marker}: {path}')

          # 1) Correct the existing conflated authority row once.
          text = history.read_text(encoding='utf-8')
          old = '| **Р. А. Фетлер** | 1861–1933 (standard reference; *needs primary card*) | 365 | Latvian-born evangelist; Far-East/emigration periodicals |'
          replacement = '''| **В. А. Фетлер (Вильгельм / William)** | 1883–1957 (RSL authority records) | surname pool not yet disambiguated | St Petersburg/Riga evangelist, author, compiler and publishing organizer; `Вера`, `Гость`, legal and devotional booklet network |
| **Р. А. Фетлер (Роберт / Robert)** | 1892–1941 (family archive strong; exact LVA file 1987/1/13296 located, contents pending) | surname pool not yet disambiguated | Omsk/Vladivostok pastor and editor-publisher of `Благовестник`; distinct younger brother of William |'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('unsafe Fetler row occurs more than once')
              text = text.replace(old, replacement)
              history.write_text(text, encoding='utf-8')
              print('replaced conflated Fetler authority row')
          elif '## v129 — `Гость` и Фетлеры: консолидированный H–L delta' not in text:
              raise SystemExit('expected conflated Fetler row missing before v129 integration')

          history_block = r'''
          ## v129 — `Гость` и Фетлеры: консолидированный H–L delta

          **Дата интеграции:** 2026-07-31  
          **Метод:** один no-loss блок вместо последовательного добавления марафонов H–L.  
          **Доказательный предел:** ни одна карточка ниже не повышается до `quote_ready`, если нет локального оригинала/скана, OCR и визуальной сверки.

          ### 1. Authority-коррекция Фетлеров

          Прежняя строка `Р. А. Фетлер | 1861–1933 | 365 | Far-East/emigration periodicals` смешивала двух братьев и заменена двумя карточками.

          - **Вильгельм Андреевич Фетлер (1883–1957)** — петербургско-рижская линия, `Вера`, `Гость`, авторская, составительская и издательская работа. РГБ закрепляет полную форму имени и годы жизни; документальная библиография связывает его со сборником о свободе совести и веротерпимости 1909 года.
          - **Роберт Андреевич Фетлер (1892–1941)** — Омск, Владивосток, Дальний Восток, редактор-издатель `Благовестника`. Семейный архив даёт точный первичный маршрут: Latvijas Valsts arhīvs, фонд 1987, опись 1 (Rīga), дело 13296; само дело ещё не просмотрено.
          - Число **365** теперь означает только `FETLER SURNAME HITS — PERSON DISAMBIGUATION REQUIRED`. Оно не принадлежит ни одному брату до контекстного пересчёта.

          ### 2. Юридическое имя и граница организаций

          - Полное утверждённое государством уставное имя сохраняло формулу о евангельских христианах и баптистах; после выхода баптистов в 1925 году в практике употреблялось название без них. Статус: `PARTIALLY RESOLVED — STATUTORY NAME VS POST-SPLIT USAGE`.
          - Союз славянских общин и Общество взаимной помощи не следует моделировать как одно юридическое лицо. В 1937 году они оформили координацию с равным представительством при сохранении автономии; официальный орган Союза в 1939 году описывал их как два самостоятельных объединения в общей `Społeczność Chrześcijan Ewangelicznych`.
          - Формула «группа Фетлера» в апрельском выпуске 1939 года исправляется на легализованное Общество взаимной помощи евангельских христиан; руководителем назван `ks. L. Jesakow`.
          - `L. Jesakow` с высокой вероятностью совпадает с Leonid/Leon Jesakow, но authority-карточка остаётся `PROBABLE SAME PERSON — NOT CLOSED`.
          - `(Husaruk)` является первичным следом ассоциации в цитируемом описании, но не доказательством должности редактора, руководителя или издателя.
          - Предупреждение Союза весной 1939 года подтверждает борьбу за принадлежность общин, однако соперничающее общество в тексте не названо и не может автоматически отождествляться с Обществом взаимной помощи.

          ### 3. Роберт Фетлер и `Благовестник`

          В публичном семейно-архивном корпусе воспроизведена обложка `Благовестника`, № 1, март 1919 года, Омск; на репродукции читается редакционный адрес Сенная, 10, а подпись называет Р. А. Фетлера редактором-издателем. Статус: `FACSIMILE REPRODUCTION VISUALLY VERIFIED — ORIGINAL ISSUE FILE NOT HELD`.

          Точные маршруты продолжения проверки:

          - Southern Baptist Historical Library and Archives, Wardin Collection AR 915, Box 9, Folder 9.5 — `Fetler, Robert — Blagovestnik, 1919–1920`;
          - Box 9, Folder 9.6 — `Fetler, Robert — Family`;
          - Государственный архив Приморского края — `Благовестник`, Владивосток, май 1921, № 5; архивный шифр требует уточнения;
          - приложение 8 книги В. А. Прохорова `В Сибирских палестинах` заявляет полный омский № 1 за 1919 год.

          Сохраняется конфликт: библиография семейного труда указывает `1919–1921`, тогда как основной текст описывает № 5 конца 1922 года как последний. До issue-level census оба значения хранятся раздельно.

          ### 4. Новый P0-корпус `Гостя`

          Музей Вильяма Фетлера / Латвийский библейский центр сообщает о физической коллекции ежемесячника `Гость` за 1923–1930 годы, переданной из латышской общины Храма спасения.

          **Установлено:** институциональный хранитель и диапазон.  
          **Не установлено:** полнота, непрерывность, дубли, приложения, состояние и права на оцифровку.  
          **Следующий шаг:** issue-level inventory, фотографии обложек и колофонов, затем точечная оцифровка.

          ### 5. Правила использования

          Allowed:

          > Использовать раздельные person/entity/imprint карточки; сохранять печатные и вычисленные значения; явно указывать происхождение семейной репродукции и неполноту музейного собрания.

          Not allowed:

          > Переносить издателя одного журнала на другой; присваивать 365 упоминаний одному Фетлеру; называть музейный диапазон полным комплектом; назначать Гусарука редактором; исправлять печатную статистику молча.
          '''
          append_once(history, '## v129 — `Гость` и Фетлеры: консолидированный H–L delta', history_block)

          periodicals_block = r'''
          ## v129 — `Гость`: контрольный корпус, издательская сеть и новые holdings

          ### A. Контрольный первичный корпус 1935–1939

          Ягеллонская цифровая библиотека хранит официальный орган Союза `Ewangeliczny Chrześcijanin` за 1935–1939 годы. Он используется как контроль для юридических имён, решений съездов, адресов и руководства, но **не** как выпуск или продолжение `Гостя`.

          - группа: https://jbc.bj.uj.edu.pl/dlibra/publication/678242/ewangeliczny-chrzescijanin
          - март 1937, № 1: https://jbc.bj.uj.edu.pl/dlibra/publication/718050/edition/680472/
          - прямой PDF марта 1937: https://jbc.bj.uj.edu.pl/Content/680472/0001_NDIGCZAS039838_110491185.pdf
          - сентябрь 1937, № 2–3: https://jbc.bj.uj.edu.pl/dlibra/publication/718051/edition/680473
          - апрель 1939, № 1: https://jbc.bj.uj.edu.pl/dlibra/publication/718058/edition/680480
          - прямой PDF апреля 1939: https://jbc.bj.uj.edu.pl/Content/680480/0001_NDIGCZAS039838_110491233.pdf

          Статус страниц: text-layer/page targets известны; `quote_ready` не присваивается без устойчивой facsimile-сверки.

          ### B. Статистика 1939 года: сохранять напечатанное и вычисленное отдельно

          | Показатель | Союз | Общество | Сумма колонок | Напечатанный итог | Статус |
          |---|---:|---:|---:|---:|---|
          | Основные общины | 82 | 49 | 131 | 131 | match |
          | Филиалы | 162 | 126 | 288 | 288 | match |
          | Миссионерские пункты | 572 | 363 | 935 | 935 | match |
          | Взрослые члены | 11 642 | 6 802 | 18 444 | 18 444 | match |
          | Члены с детьми | 16 007 | 11 373 | 27 380 | 27 383 | arithmetic conflict |
          | Пресвитеры и диаконы | 116 | 40 | 156 | 156 | match |
          | Евангелисты и работники | 187 | 213 | 400 | 401 | arithmetic conflict |
          | Воскресные школы | 63 | 91 | 154 | 154 | match |
          | Молодёжные кружки | 71 | 78 | 149 | 149 | match |
          | Хоры | 68 | 62 | 130 | 130 | match |
          | Женские объединения | 25 | 31 | 56 | 56 | match |
          | Приюты | 1 | 1 | 2 | 2 | match |

          ### C. Источниковая цепочка 1935–1939

          `Kirchenblatt für die reformierte Schweiz`, № 21–22/1935  
          → `Zwiastun Ewangeliczny`, № 51–52/1935 и № 1/1936  
          → `Ewangeliczny Chrześcijanin`, март 1937  
          → корректирующая статья апреля 1939.

          Это граф передачи, а не четыре независимых свидетельства. Для каждого тезиса нужно устанавливать первое появление, перевод и редакционную правку.

          Контрольный немецкий текст: Eduard Kupsch, `Die Freikirchen in Polen`, в `Die evangelischen Kirchen in Polen`, 1938, с. 172–182. Страницы ещё не получены.

          ### D. `Гость` как издательский узел

          РГБ фиксирует брошюры 1916 года, изданные через редакцию/контору `Гостя`:

          - `Скрытое сокровище`, `Полезная литература`, № 188: https://search.rsl.ru/ru/record/01004213601
          - R. A. Torrey, `Потрясающий вопрос`, титульный № 14: https://search.rsl.ru/ru/record/01004214188

          Модель должна различать: periodical, editorial office, publishing imprint, booklet series, editor, translator, printer и distribution address.

          ### E. Holdings и пробелы

          - **Музей Вильяма Фетлера / LBC:** физическая коллекция `Гостя` 1923–1930; completeness unknown; P0 issue inventory. https://bible.lv/en/fetler-family-heirlooms/
          - **Семейный корпус 2026:** публичная современная компиляция с репродукциями первичных изображений; не оригинальный журнал. https://drive.google.com/file/d/1CUpNUJKayB3witUEm8bhzVP9VPAC1vv-/view
          - **AAN 1446, стр. 70:** государственный материал использовал сведения, атрибутированные `Siejatiel Istiny` или `Gost`, среди других источников; конкретный номер не установлен.
          - **AAN I 1082:** устав Союза и переписка 1922–1931; без сканов; P0.
          - **KUL 1927:** восьмистраничный печатный устав, OAI `dlibra.kul.pl:1866`; полный текст/стабильный файл ещё требуется.
          '''
          append_once(periodicals, '## v129 — `Гость`: контрольный корпус, издательская сеть и новые holdings', periodicals_block)

          ledger_block = r'''
          ## v129 — `Гость` / Фетлеры: consolidated proof, supersession and request ledger

          | ID | Тезис / объект | Evidence | Финальный статус | Разрешено сейчас | Заблокировано до |
          |---|---|---|---|---|---|
          | GOST-129-001 | утверждённое уставное имя и послераскольное употребление | IPN + KUL/AAN routes | partially_resolved | различать statutory name и usage | AAN I 1082 reviewed |
          | GOST-129-002 | Союз и Общество взаимной помощи — самостоятельные организации | contemporary Union periodical | primary_boundary_confirmed | cooperation with autonomy | не выводить общего издателя |
          | GOST-129-003 | «группа Фетлера» = легализованное Общество; `L. Jesakow` глава | April 1939 primary text layer | strong_primary_text_visual_pending | organization/role with attribution | facsimile exact wording |
          | GOST-129-004 | неназванное общество переманивало общины Союза | April 1939 warning | competition_confirmed_counterpart_unknown | state Union allegation | назвать Mutual Aid Society |
          | GOST-129-005 | `(Husaruk)` в цитируемом описании | primary trace | semantic_role_hold | register association lead | editor/head/publisher role |
          | GOST-129-006 | 27 380 vs 27 383 | printed statistics | arithmetic_conflict | keep both values | silent correction |
          | GOST-129-007 | 400 vs 401 | printed statistics | arithmetic_conflict | keep both values | silent correction |
          | GOST-129-008 | William and Robert Fetler were conflated | RSL + denominational/family/archive routes | critical_correction_applied | separate authority records | restore old row |
          | GOST-129-009 | 365 Fetler hits | repository navigation count | surname_pool | contextual recount | person-specific attribution |
          | GOST-129-010 | `Благовестник` № 1, март 1919, Омск, Сенная 10 | reproduced primary image in family compilation | facsimile_reproduction_verified | cite with provenance | claim original issue acquired |
          | GOST-129-011 | Robert lifespan 1892–1941 | family archive + exact LVA file route | strong_family_archive_primary_file_pending | use with qualifier | primary-card verified |
          | GOST-129-012 | LBC holds `Гость` 1923–1930 | institutional museum statement | holding_confirmed_completeness_unknown | request issue inventory | call complete run |
          | GOST-129-013 | AAN 1446 p.70 source family | precise scholarly archival locator | source_family_confirmed | `Siejatiel Istiny` or `Gost` among sources | specific issue/table |
          | GOST-129-014 | family PDF binary | public modern compilation | reference_verified_no_repo_binary | link, metadata, SHA in Drive | commit/upload duplicate |

          ### Superseded statements

          1. `Р. А. Фетлер, 1861–1933, 365 posts, Far-East/emigration periodicals` → **deprecated conflation; replaced by William and Robert cards**.
          2. `15 February 1905 should be March` → **rejected preliminary hypothesis; February sequence is valid**.
          3. `1937 cooperation implies merger` → **rejected; autonomy retained**.
          4. `Husaruk was editor/head` → **unsupported; HOLD**.
          5. `printed totals can be normalized arithmetically` → **rejected; printed and calculated values remain separate**.

          ### Institutional request queue — not sent

          | Priority | Institution / reference | Required output | De-dup guard |
          |---|---|---|---|
          | P0 | LBC / William Fetler Museum, `Гость` 1923–1930 | issue inventory, gaps, covers, colophons, provenance, digitization terms | update existing museum card |
          | P0 | AAN `2/9/0/2.2/I 1082` | full file or statute/approval/name/address/seal pages | no duplicate request |
          | P0 | AAN `2/14/0/5/1446`, p.70 ± surrounding pages | source legend, attachments, exact attribution | update existing 1446 card |
          | P0 | Archiwum Państwowe w Lublinie `35/413/0/9/644` | Society statute, registration, board, addresses, publishing rights | update existing lead |
          | P0 | Latvijas Valsts arhīvs `1987/1/13296` | title, questionnaire, birth, arrest/deportation/death records | exact new route |
          | P0 | SBHLA Wardin AR 915, Box 9, Folders 9.5–9.6 | folder inventory and representative/full scans | do not request whole collection |
          | P1 | GAPK, `Благовестник`, May 1921 № 5 | fond/opis/delo/list, cover, imprint, full issue | resolve signature first |
          | P1 | Prokhorov, Appendix 8 | pages reproducing Omsk 1919 № 1 | do not order full book if extract possible |
          | P1 | Kupsch, pp.172–182 | exact German wording around Fetler/Husaruk | targeted pages only |
          | P1 | GCAH, `Jesakow, Leonid (Rev.), 1949` | biography and prewar identity links | identity remains probable |
          | P2 | AAN I 1081, Berlin World Baptist Congress 1933–1934 | inventory/participants/press attachments | after P0 files |

          ### Stable source routes

          - IPN article/PDF: https://czasopisma.ipn.gov.pl/index.php/pis/article/download/2522/2386/3538
          - KUL statute: https://dlibra.kul.pl/publication/1714/edition/1866/
          - JBC group: https://jbc.bj.uj.edu.pl/dlibra/publication/678242/ewangeliczny-chrzescijanin
          - JBC March 1937 PDF: https://jbc.bj.uj.edu.pl/Content/680472/0001_NDIGCZAS039838_110491185.pdf
          - JBC April 1939 PDF: https://jbc.bj.uj.edu.pl/Content/680480/0001_NDIGCZAS039838_110491233.pdf
          - RSL Husaruk memoir: https://search.rsl.ru/ru/record/01000371468
          - RSL William Fetler 1909: https://search.rsl.ru/ru/record/01006754154
          - RSL William Fetler 1914: https://search.rsl.ru/ru/record/01006746395
          - Presidential Library tolerance collection route: https://www.prlib.ru/history/619208
          - LBC museum/family archive: https://bible.lv/en/fetler-family-heirlooms/
          - public family compilation: https://drive.google.com/file/d/1CUpNUJKayB3witUEm8bhzVP9VPAC1vv-/view
          - AGAD inventory: https://agad.gov.pl/pomoce/KsOMB456.xml
          '''
          append_once(ledgers, '## v129 — `Гость` / Фетлеры: consolidated proof, supersession and request ledger', ledger_block)

          readme_block = r'''
          ## v129 update — `Гость` / Фетлеры, no-loss H–L integration

          - Исправлена склейка Вильгельма и Роберта Фетлеров; `365` перенесено в surname-disambiguation pool.
          - В existing grouped masters интегрированы юридическая граница Союза/Общества, JBC-корпус 1935–1939, статистические конфликты, HOLD по Husaruk и authority-route Jesakow.
          - Зарегистрированы точные маршруты `Благовестника`, LVA 1987/1/13296, Wardin AR 915 Box 9/9.5–9.6 и музейная коллекция `Гостя` 1923–1930.
          - Новых scattered MD и тяжёлых бинарников не создано; `quote_ready` не повышался.
          '''
          append_once(readme, '## v129 update — `Гость` / Фетлеры, no-loss H–L integration', readme_block)

          # 2) Update existing CSV ledgers dynamically, without assuming a fixed historical schema.
          def norm(s):
              return re.sub(r'[^a-z0-9а-я]+', '_', (s or '').strip().lower()).strip('_')

          def pick(fieldnames, names):
              indexed = {norm(x): x for x in fieldnames}
              for name in names:
                  if norm(name) in indexed:
                      return indexed[norm(name)]
              return None

          def append_records(path: Path, records, dedup_values):
              raw = path.read_text(encoding='utf-8-sig')
              reader = csv.DictReader(raw.splitlines())
              fields = reader.fieldnames or []
              rows = list(reader)
              joined = raw.lower()
              added = 0
              for rec, dedup in zip(records, dedup_values):
                  if dedup.lower() in joined:
                      continue
                  row = {f: '' for f in fields}
                  mapping = {
                      'id': ['id','record_id','source_id','proof_id','item_id'],
                      'series': ['series','corpus','periodical'],
                      'year': ['year','date','period'],
                      'issue': ['issue','issues','number','no'],
                      'title': ['title','item','source_title','claim'],
                      'url': ['url','source_url','link','evidence_url'],
                      'status': ['status','proof_status','current_status'],
                      'evidence': ['evidence','evidence_class','source_type','confidence'],
                      'notes': ['notes','note','caution','use_caution','comment'],
                      'next': ['next_action','next_step','required_output','action'],
                      'priority': ['priority'],
                  }
                  for key, names in mapping.items():
                      f = pick(fields, names)
                      if f and key in rec:
                          row[f] = rec[key]
                  if not any(row.values()):
                      print(f'skip unknown CSV schema: {path} fields={fields}')
                      break
                  rows.append(row)
                  joined += '\n' + ' '.join(row.values()).lower()
                  added += 1
              if added:
                  with path.open('w', encoding='utf-8-sig', newline='') as fh:
                      w = csv.DictWriter(fh, fieldnames=fields)
                      w.writeheader(); w.writerows(rows)
                  print(f'added {added} rows: {path}')

          csv_files = {p.name: p for p in root.rglob('*.csv')}
          source_path = csv_files.get('SOURCE_ANCHORS.csv')
          proof_path = csv_files.get('PROOF_STATUS_LEDGER.csv')
          batch_path = csv_files.get('NEXT_MICROBATCH.csv')

          if source_path:
              source_records = [
                  ({'id':'GOST-129-SRC-JBC1939','series':'Ewangeliczny Chrześcijanin','year':'1939','issue':'1','title':'Primary control issue: organization, statistics, warning','url':'https://jbc.bj.uj.edu.pl/dlibra/publication/718058/edition/680480','status':'primary_text_layer_visual_pending','evidence':'A','notes':'not Gost; preserve arithmetic conflicts'}, 'GOST-129-SRC-JBC1939'),
