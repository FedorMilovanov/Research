name: G3 Wayback late-board acquisition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'G3_HISTORY/tools/acquire_wayback_late_board.py'
      - 'G3_HISTORY/tools/acquire_wayback_late_board_v2.py'
      - 'G3_HISTORY/EVIDENCE_BATCH_2026-09-07_PASS10.md'
      - '.github/workflows/g3-wayback-late-board-acquisition.yml'
      - 'data/artifact-custody-policy-v2.json'

permissions:
  contents: read

concurrency:
  group: g3-wayback-late-board-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'

      - name: Compile acquisition tool
        run: python -m py_compile G3_HISTORY/tools/acquire_wayback_late_board_v2.py

      - name: Acquire late-board archive objects
        id: acquire
        continue-on-error: true
        run: python G3_HISTORY/tools/acquire_wayback_late_board_v2.py --output g3-wayback-late-board-output

      - name: Classify acquisition outcome
        env:
          ACQUIRE_OUTCOME: ${{ steps.acquire.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('g3-wayback-late-board-output')
          summary_path = root / 'SUMMARY.json'
          if not summary_path.exists():
              print('::error::Acquisition produced no SUMMARY.json; fail closed.')
              raise SystemExit(2)

          try:
              summary = json.loads(summary_path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'::error::SUMMARY.json is unreadable: {exc}')
              raise SystemExit(2)

          errors = summary.get('errors')
          holds = summary.get('transport_holds')
          if not isinstance(errors, list) or not isinstance(holds, list):
              print('::error::SUMMARY.json does not expose list-valued errors/transport_holds.')
              raise SystemExit(2)

          outcome = os.environ.get('ACQUIRE_OUTCOME', '')
          if errors:
              print('::error::Late-board acquisition contains semantic/non-transport defects.')
              for error in errors:
                  print('ERROR', error)
              raise SystemExit(2)

          if holds:
              state = 'TRANSPORT_HOLD'
              print('::warning::Wayback transport was unavailable after bounded retries. Historical continuity evidence is unchanged; see artifact classification.')
          elif outcome == 'success':
              state = 'ACQUISITION_SUCCEEDED'
          else:
              print('::error::Acquisition step failed without a classified transport hold; fail closed.')
              raise SystemExit(2)

          classification = {
              'state': state,
              'acquireStepOutcome': outcome,
              'transportHolds': holds,
              'semanticEvidenceChanged': False if state == 'TRANSPORT_HOLD' else None,
              'publicationEligible': False,
              'rule': (
                  'TransportHold is emitted only after bounded retryable HTTP/URL/timeout exhaustion. '
                  'Parse/schema/decode/invariant and non-retryable HTTP defects remain CI failures. '
                  'Known locator fallback never counts as a CDX continuity result.'
              ),
          }
          (root / 'ACQUISITION_CLASSIFICATION.json').write_text(
              json.dumps(classification, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print('ACQUISITION_CLASSIFICATION', state)
          PY

      - name: Record ephemeral custody context
        if: always()
        run: |
          mkdir -p g3-wayback-late-board-output
          git rev-parse HEAD > g3-wayback-late-board-output/RESEARCH_COMMIT.txt
          printf '%s\n' "${GITHUB_RUN_ID}" > g3-wayback-late-board-output/WORKFLOW_RUN_ID.txt
          printf '%s\n' "${GITHUB_RUN_ATTEMPT}" > g3-wayback-late-board-output/WORKFLOW_RUN_ATTEMPT.txt
          sha256sum G3_HISTORY/tools/acquire_wayback_late_board_v2.py > g3-wayback-late-board-output/ACQUISITION_TOOL_SHA256.txt
          sha256sum data/artifact-custody-policy-v2.json > g3-wayback-late-board-output/CUSTODY_POLICY_SHA256.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('g3-wayback-late-board-output')
          receipt={
              'state':'EPHEMERAL_ACTION_ARTIFACT',
              'publicationEligible':False,
              'retentionDays':7,
              'durableReceiptPresent':False,
              'policy':'data/artifact-custody-policy-v2.json',
              'workflow':'.github/workflows/g3-wayback-late-board-acquisition.yml',
              'runId':os.environ.get('GITHUB_RUN_ID'),
              'runAttempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'repository':os.environ.get('GITHUB_REPOSITORY'),
              'ref':os.environ.get('GITHUB_REF'),
              'eventSha':os.environ.get('GITHUB_SHA'),
              'checkedOutSha':(root/'RESEARCH_COMMIT.txt').read_text(encoding='utf-8').strip(),
              'warning':'Archived web bytes are research evidence only; Actions artifact retention is not durable custody and does not authorize publication.'
          }
          (root/'ACTION_CUSTODY.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload temporary archive evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: g3-wayback-late-board-${{ github.run_id }}-${{ github.run_attempt }}
          path: g3-wayback-late-board-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Ensure acquisition lane is read-only
        if: always()
        run: git diff --exit-code
