name: Baptist Derivative Transcriptions

on:
  pull_request:
    paths:
      - "data/baptist-derivative-transcription-authority-2026-08-02.json"
      - "RUSSIAN_BAPTISTS_ARCHIVE/00_CURRENT_AUTHORITY_2026-08-02.md"
      - "RUSSIAN_BAPTISTS_ARCHIVE/drive_acquisition_delta_2026-08-02-b.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/drive_acquisition_delta_2026-08-02-c.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/SHILOV_LENIN_1919_DERIVATIVE_CLASSIFICATION_2026-08-02.md"
      - "RUSSIAN_BAPTISTS_ARCHIVE/MOSCOW_COMMUNITY_1923_DERIVATIVE_CLASSIFICATION_2026-08-02.md"
      - "scripts/validate_baptist_derivative_transcriptions.py"
      - ".github/workflows/baptist-derivative-transcriptions.yml"
  push:
    branches: [main]
    paths:
      - "data/baptist-derivative-transcription-authority-2026-08-02.json"
      - "RUSSIAN_BAPTISTS_ARCHIVE/00_CURRENT_AUTHORITY_2026-08-02.md"
      - "RUSSIAN_BAPTISTS_ARCHIVE/drive_acquisition_delta_2026-08-02-b.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/drive_acquisition_delta_2026-08-02-c.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/SHILOV_LENIN_1919_DERIVATIVE_CLASSIFICATION_2026-08-02.md"
      - "RUSSIAN_BAPTISTS_ARCHIVE/MOSCOW_COMMUNITY_1923_DERIVATIVE_CLASSIFICATION_2026-08-02.md"
      - "scripts/validate_baptist_derivative_transcriptions.py"
      - ".github/workflows/baptist-derivative-transcriptions.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile validator
        run: python3 -m py_compile scripts/validate_baptist_derivative_transcriptions.py
      - name: Validate derivative source classes
        run: python3 scripts/validate_baptist_derivative_transcriptions.py
      - name: Ensure validator is read-only
        run: git diff --exit-code
