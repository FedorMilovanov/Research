name: Gill PR2 Lossless Reconciliation

on:
  pull_request:
    paths:
      - data/repository-evidence-policy-v2.json
      - incoming/arena-auditor/2026-07-09/GILL_SERIES_EVIDENCE_ARCHIVE_V1_V11_001_480_2026-07-09.md
      - 'Джон Гилл/**'
      - scripts/gill-pr2-lossless-reconciliation-audit.mjs
      - .github/workflows/gill-pr2-lossless-reconciliation.yml
  push:
    branches: [main]
    paths:
      - data/repository-evidence-policy-v2.json
      - incoming/arena-auditor/2026-07-09/GILL_SERIES_EVIDENCE_ARCHIVE_V1_V11_001_480_2026-07-09.md
      - 'Джон Гилл/**'
      - scripts/gill-pr2-lossless-reconciliation-audit.mjs
      - .github/workflows/gill-pr2-lossless-reconciliation.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete Research history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          path: Research
      - name: Checkout complete Product history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FedorMilovanov/gb-is-my-strength
          ref: 877508fbfe42883b99922e3dcc717adfa91c33ad
          fetch-depth: 0
          path: Product
          persist-credentials: false
      - name: Fetch pinned Gill Product witness
        run: |
          git -C Product cat-file -e '433c76ddd4ee37e9efe8fd4f5fc7573aa8e2a736^{commit}' || \
            git -C Product fetch --no-tags --depth=1 origin 433c76ddd4ee37e9efe8fd4f5fc7573aa8e2a736
          git -C Product cat-file -e '433c76ddd4ee37e9efe8fd4f5fc7573aa8e2a736^{commit}'
      - name: Verify Research blobs, Product commit witnesses and 001-480 mapping
        working-directory: Research
        env:
          GILL_PRODUCT_REPO: ../Product
        run: node scripts/gill-pr2-lossless-reconciliation-audit.mjs
      - name: Ensure both checkouts are read-only
        run: |
          git -C Research diff --exit-code
          git -C Product diff --exit-code
          test -z "$(git -C Research status --porcelain)"
          test -z "$(git -C Product status --porcelain)"
