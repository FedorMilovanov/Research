name: 1 Peter product handoff integrity

on:
  pull_request:
    paths:
      - '1_PETER_BOT/**'
      - '.github/workflows/1peter-product-handoff-audit.yml'
  push:
    branches:
      - main
    paths:
      - '1_PETER_BOT/**'
      - '.github/workflows/1peter-product-handoff-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  handoff-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic immutable handoff candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/1peter-immutable-handoff
          VERIFY_ARGS=()
          if [[ -f 1_PETER_BOT/product_handoff/CURRENT_RELEASE.json ]]; then
            VERIFY_ARGS=(--verify-root 1_PETER_BOT/product_handoff)
          fi
          python 1_PETER_BOT/scripts/package_product_handoff_release.py \
            --output-root /tmp/1peter-immutable-handoff \
            "${VERIFY_ARGS[@]}"
      - name: Run adversarial tamper suite
        run: python 1_PETER_BOT/scripts/test_product_handoff_tampering.py
      - name: Assert immutable release machine contract
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import tarfile
          from pathlib import Path

          digest = '1f444991ecc2f180abdbe0f459148ba8dbf0a5045b1d8888e462683c78366c7d'
          decoded_sha = '2810acfc23c8476a0adbd224500f910612b29d438fbcdf489e7552420a983122'
          root = Path('/tmp/1peter-immutable-handoff')
          release = root / 'releases' / digest
          pointer = json.loads((root / 'CURRENT_RELEASE.json').read_text(encoding='utf-8'))
          manifest = json.loads((release / 'release-manifest.json').read_text(encoding='utf-8'))
          index = json.loads((release / 'bundle-index.json').read_text(encoding='utf-8'))

          chunks = []
          for record in index['segments']:
              path = release / record['name']
              payload = path.read_bytes()
              assert hashlib.sha256(payload).hexdigest() == record['sha256']
              assert len(payload) == record['bytes']
              text = payload.decode('ascii').strip()
              assert len(text) == record['base64_chars']
              chunks.append(text)
          bundle = base64.b64decode(''.join(chunks), validate=True)
          actual_decoded_sha = hashlib.sha256(bundle).hexdigest()

          assert pointer['research_authority_sha'] == '0142430af8ba80f28e0fd9cde669d32611a1d2af'
          assert pointer['authority_digest_sha256'] == digest
          assert pointer['whole_authority_sha256'] == digest
          assert pointer['storage_encoding'] == 'ordered-base64-segments'
          assert pointer['decoded_bundle_sha256'] == decoded_sha == actual_decoded_sha
          assert manifest['immutable'] is True
          assert manifest['authority_digest_sha256'] == digest
          assert manifest['whole_authority_sha256'] == digest
          assert manifest['counts'] == {
              'total': 144,
              'chapter4': 72,
              'chapter5': 72,
              'current_holds': 0,
              'competitive_candidates': 0,
              'source_identity_records': 112,
              'claim_source_inspection_edges': 282,
          }
          assert manifest['prototype_disposition_counts'] == {
              'SAFE': 26,
              'NEEDS_REWRITE': 19,
              'COURSE_POSITION_ONLY': 2,
              'NONCOMPETITIVE_ONLY': 12,
              'REJECT_AS_PRODUCT_TEMPLATE': 5,
          }
          assert index['decoded_bundle_sha256'] == decoded_sha
          assert index['segment_count'] == len(index['segments']) == 8
          assert index['member_count'] == 12
          assert index['deterministic_bundle_two_run_byte_equivalent'] is True
          assert index['segment_round_trip_verified'] is True

          with tarfile.open(fileobj=io.BytesIO(bundle), mode='r:xz') as tar:
              members = {m.name: tar.extractfile(m).read() for m in tar.getmembers() if m.isfile()}
          assert sorted(members) == sorted(index['members'])
          for name, expected_sha in index['expanded_member_sha256'].items():
              assert hashlib.sha256(members[name]).hexdigest() == expected_sha

          claims = json.loads(members['claim-digests.json'])
          edges = json.loads(members['claim-source-edge-ids.json'])
          identities = json.loads(members['source-identity-package.json'])['records']
          summary = json.loads(members['integrity-summary.json'])
          prototypes = json.loads(members['prototype-audit.json'])['records']
          ranking = json.loads(members['ranking-audit.json'])['records']

          assert claims['count'] == 144
          assert len({x['candidate_id'] for x in claims['records']}) == 144
          assert all(len(x['effective_claim_digest']) == 64 for x in claims['records'])
          assert edges['count'] == 282
          assert len({x['claim_inspection_edge_id'] for x in edges['records']}) == 282
          assert len(identities) == 112
          forbidden_identity_keys = {
              'claim_id', 'claim_confidence', 'claim_position', 'claim_ready',
              'passage_exegesis_proved', 'ranking_ready', 'inspection_depth',
              'strongest_evidence_status'
          }
          assert all(row.get('identity_only') is True for row in identities)
          assert all(forbidden_identity_keys.isdisjoint(row) for row in identities)

          rejects = sorted(
              row['prototype_id'] for row in prototypes
              if row['prototype_disposition'] == 'REJECT_AS_PRODUCT_TEMPLATE'
          )
          assert rejects == ['w3mcq_003', 'w3mcq_020', 'w3mcq_027', 'w3mcq_037', 'w3mcq_047']
          assert all(
              'REFERENCE_DRIFT' in row.get('reasons', [])
              for row in prototypes if row['prototype_id'] in rejects
          )

          w3q123 = next(row for row in ranking if row['candidate_id'] == 'w3q_123')
          assert w3q123['admitted'] is False
          assert w3q123['disposition'] == 'NO_PRODUCT_RANKING_ADMISSION'
          assert summary['current_holds'] == 0
          assert summary['competitive_candidates'] == 0
          assert summary['deterministic_two_run_byte_equivalent'] is True
          assert summary['source_depth_boundaries_machine_enforced'] is True
          print('IMMUTABLE_HANDOFF_MACHINE_CONTRACT_OK')
          PY
      - name: Publish verified immutable release on canonical handoff branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/1peter-product-handoff-audit' }}
        shell: bash
        env:
          INITIAL_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ -f 1_PETER_BOT/product_handoff/CURRENT_RELEASE.json ]]; then
            echo 'Committed immutable release already exists; publish step is a no-op.'
            exit 0
          fi

          git fetch origin "${TARGET_BRANCH}"
          REMOTE_HEAD="$(git rev-parse "origin/${TARGET_BRANCH}")"
          if [[ "${REMOTE_HEAD}" != "${INITIAL_HEAD}" ]]; then
            echo "Refusing stale release publication: remote=${REMOTE_HEAD}, validated=${INITIAL_HEAD}" >&2
            exit 1
          fi

          DIGEST='1f444991ecc2f180abdbe0f459148ba8dbf0a5045b1d8888e462683c78366c7d'
          RELEASE_ROOT='1_PETER_BOT/product_handoff'
          mkdir -p "${RELEASE_ROOT}/releases"
          cp /tmp/1peter-immutable-handoff/CURRENT_RELEASE.json "${RELEASE_ROOT}/CURRENT_RELEASE.json"
          cp -a "/tmp/1peter-immutable-handoff/releases/${DIGEST}" "${RELEASE_ROOT}/releases/${DIGEST}"

          git add "${RELEASE_ROOT}/CURRENT_RELEASE.json" "${RELEASE_ROOT}/releases/${DIGEST}"
          python - <<'PY'
          import subprocess
          digest = '1f444991ecc2f180abdbe0f459148ba8dbf0a5045b1d8888e462683c78366c7d'
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          allowed_prefix = f'1_PETER_BOT/product_handoff/releases/{digest}/'
          allowed_pointer = '1_PETER_BOT/product_handoff/CURRENT_RELEASE.json'
          assert names, 'publish step produced no staged immutable files'
          assert all(name == allowed_pointer or name.startswith(allowed_prefix) for name in names), names
          assert allowed_pointer in names
          print('PUBLISH_SCOPE_OK', len(names))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish immutable 1 Peter Ch4-5 handoff release'
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Upload deterministic handoff release candidate
        uses: actions/upload-artifact@v4
        with:
          name: 1peter-product-handoff-${{ github.sha }}
          path: /tmp/1peter-immutable-handoff
          if-no-files-found: error
          retention-days: 30
