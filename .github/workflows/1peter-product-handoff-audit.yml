name: 1 Peter product handoff integrity

on:
  pull_request:
    paths:
      - '1_PETER_BOT/**'
      - '.github/workflows/1peter-product-handoff-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive and validate effective handoff
        shell: bash
        run: |
          rm -rf /tmp/1peter-handoff
          set +e
          OUTPUT="$(python 1_PETER_BOT/scripts/validate_product_handoff_ci.py --emit-dir /tmp/1peter-handoff 2>&1)"
          CODE=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$CODE" -ne 0 ]; then
            ONE_LINE="$(printf '%s' "$OUTPUT" | tr '\n' ' ' | head -c 3000)"
            echo "::error title=1 Peter handoff audit failed::$ONE_LINE"
            exit "$CODE"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/1peter-handoff')
          required = {
              'chapter4-product-handoff.json', 'chapter5-product-handoff.json',
              'claim-overclaim-blacklist.json', 'source-identity-package.json',
              'claim-inspection-manifest.json', 'prototype-audit.json',
              'ranking-audit.json', 'integrity-summary.json'
          }
          assert required == {x.name for x in p.iterdir()}, 'generated artifact set drift'
          s = json.loads((p/'integrity-summary.json').read_text())
          assert s['chapter4'] == 72 and s['chapter5'] == 72
          assert s['current_holds'] == 0
          assert s['competitive_candidates'] == 0
          assert s['prototype_count'] == 64
          assert s['overclaim_blacklist_records'] == 144
          assert s['ranking_admitted'] == 0
          summary = (
              f"Ch4={s['chapter4']} Ch5={s['chapter5']} HOLD={s['current_holds']} "
              f"competitive={s['competitive_candidates']} prototypes={s['prototype_count']} "
              f"prototype_classes={s['prototype_classification_counts']} "
              f"blacklist={s['overclaim_blacklist_records']} ranking={s['ranking_admitted']} "
              f"ranking_discrepancies={s['ranking_discrepancy_candidates']} "
              f"source_identities={s['source_identity_records']} inspection_edges={s['claim_source_inspection_edges']}"
          )
          print(f"::notice title=1 Peter handoff audit summary::{summary}")
          PY
