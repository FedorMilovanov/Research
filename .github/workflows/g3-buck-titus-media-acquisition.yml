name: G3 Buck Titus original-media acquisition

on:
  push:
    branches:
      - research/g3-history-20260907
    paths:
      - G3_HISTORY/tools/acquire_buck_titus_media.py
      - .github/workflows/g3-buck-titus-media-acquisition.yml

permissions:
  contents: read

env:
  G3_MEDIA_EVIDENCE_OUT: g3-media-evidence
  WHISPER_MODEL: base.en

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install read-only acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp openai-whisper

      - name: Acquire public Vimeo metadata and ephemeral audio segment
        run: |
          set -euo pipefail
          python G3_HISTORY/tools/acquire_buck_titus_media.py

      - name: Assert no audio binary enters artifact
        run: |
          set -euo pipefail
          if find "$G3_MEDIA_EVIDENCE_OUT" -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.mp4' -o -iname '*.webm' \) | grep -q .; then
            echo 'Audio/video binary unexpectedly present in artifact staging' >&2
            exit 1
          fi
          test -f "$G3_MEDIA_EVIDENCE_OUT/ACQUISITION_RECEIPT.json"
          test -f "$G3_MEDIA_EVIDENCE_OUT/metadata.json"

      - name: Record exact GitHub provenance
        run: |
          cat > "$G3_MEDIA_EVIDENCE_OUT/GITHUB_PROVENANCE.txt" <<EOF
          repository=$GITHUB_REPOSITORY
          sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          workflow=$GITHUB_WORKFLOW
          publication_authorized=false
          item_verified=false
          EOF

      - name: Upload transcript and custody receipt only
        uses: actions/upload-artifact@v4
        with:
          name: g3-buck-titus-media-evidence-${{ github.sha }}
          path: g3-media-evidence/
          retention-days: 7
          if-no-files-found: error
