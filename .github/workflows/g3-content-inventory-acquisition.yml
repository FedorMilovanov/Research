name: G3 public content inventory acquisition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - G3_HISTORY/tools/acquire_g3_content_inventory.py
      - G3_HISTORY/requirements-content.lock
      - .github/workflows/g3-content-inventory-acquisition.yml
  push:
    branches: [main]
    paths:
      - G3_HISTORY/tools/acquire_g3_content_inventory.py
      - G3_HISTORY/requirements-content.lock
      - .github/workflows/g3-content-inventory-acquisition.yml

permissions:
  contents: read

concurrency:
  group: g3-content-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  G3_CONTENT_OUT: g3-content-inventory

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'

      - name: Install pinned metadata-only dependency
        run: python -m pip install --disable-pip-version-check -r G3_HISTORY/requirements-content.lock

      - name: Compile metadata-only acquisition tool
        run: python -m py_compile G3_HISTORY/tools/acquire_g3_content_inventory.py

      - name: Acquire sitemap and WordPress metadata only
        run: |
          set -euo pipefail
          python G3_HISTORY/tools/acquire_g3_content_inventory.py

      - name: Assert no article bodies are staged
        run: |
          set -euo pipefail
          test -f "$G3_CONTENT_OUT/ACQUISITION_RECEIPT.json"
          test -f "$G3_CONTENT_OUT/sitemap_urls.csv"
          test -f "$G3_CONTENT_OUT/wp_posts_metadata.csv"
          ! find "$G3_CONTENT_OUT" -type f -name '*.html' | grep -q .

      - name: Record exact runtime provenance
        run: |
          python -m pip freeze | sort > "$G3_CONTENT_OUT/PYTHON_DEPENDENCIES.txt"
          cat > "$G3_CONTENT_OUT/GITHUB_PROVENANCE.txt" <<EOF
          repository=$GITHUB_REPOSITORY
          sha=$GITHUB_SHA
          checked_out_sha=$(git rev-parse HEAD)
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          workflow=$GITHUB_WORKFLOW
          metadata_only=true
          publication_authorized=false
          EOF

      - name: Upload metadata inventory
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: g3-content-inventory-${{ github.sha }}
          path: g3-content-inventory/
          retention-days: 7
          if-no-files-found: error
