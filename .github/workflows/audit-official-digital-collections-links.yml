name: Audit official digital collections links

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 3'
  pull_request:
    paths:
      - '.github/workflows/audit-official-digital-collections-links.yml'
      - 'SOURCE_LIBRARY/tools/audit_official_collection_links.py'
      - 'SOURCE_LIBRARY/OFFICIAL_DIGITAL_COLLECTIONS_70PLUS_INDEX_2026-07-30.md'
      - 'requirements/source-audit.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-official-digital-collections-links.yml'
      - 'SOURCE_LIBRARY/tools/audit_official_collection_links.py'
      - 'SOURCE_LIBRARY/OFFICIAL_DIGITAL_COLLECTIONS_70PLUS_INDEX_2026-07-30.md'
      - 'requirements/source-audit.lock'

permissions:
  contents: read

concurrency:
  group: official-collections-link-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Check all official collection URLs
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout exact source index and audit code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements/source-audit.lock

      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/source-audit.lock

      - name: Compile audit
        run: python -m py_compile SOURCE_LIBRARY/tools/audit_official_collection_links.py

      - name: Audit official collection links
        run: >-
          python SOURCE_LIBRARY/tools/audit_official_collection_links.py
          --source SOURCE_LIBRARY/OFFICIAL_DIGITAL_COLLECTIONS_70PLUS_INDEX_2026-07-30.md
          --output link-audit-output
          --timeout 45
          --pause 0.2

      - name: Enforce official-collection health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('link-audit-output/official-collections-link-audit.json').read_text(encoding='utf-8'))
          records = data['records']
          dead = [row for row in records if row['classification'] == 'DEAD']
          malformed = [row for row in records if row['classification'] == 'UNKNOWN']
          severe = [row for row in records if row['classification'] in {'DNS_ERROR', 'TLS_ERROR', 'NETWORK_ERROR'}]
          if dead:
              raise SystemExit(f'official collection endpoints returned 404/410: {len(dead)}')
          if malformed:
              raise SystemExit(f'unclassified official collection records: {len(malformed)}')
          if len(severe) > 3:
              raise SystemExit(f'inconclusive official collection audit: {len(severe)} severe network failures')
          print(data['classification_counts'])
          PY

      - name: Publish summary
        run: cat link-audit-output/OFFICIAL_COLLECTIONS_LINK_AUDIT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record reproducibility metadata
        run: |
          git rev-parse HEAD > link-audit-output/RESEARCH_COMMIT.txt
          python -m pip freeze > link-audit-output/PIP_FREEZE.txt
          sha256sum requirements/source-audit.lock > link-audit-output/DEPENDENCY_LOCK_SHA256.txt

      - name: Ensure audit is read-only
        run: git diff --exit-code

      - name: Upload link-audit evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: official-digital-collections-link-audit
          path: link-audit-output/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
