name: Apply Gost v135 congress supersession

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/README-gost-v135-trigger.txt'

permissions:
  contents: write

concurrency:
  group: baptists-grouped-writes
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and push guarded delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.whitespace cr-at-eol
          git config core.quotePath false

          paths=(
            "БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED/data/NEXT_MICROBATCH.csv"
            "БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED/data/PROOF_STATUS_LEDGER.csv"
            "БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED/data/SOURCE_ANCHORS.csv"
            "БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED/groups/06_DATA_AND_PROOF_LEDGERS.md"
          )

          success=0
          for attempt in 1 2 3 4; do
            echo "attempt=$attempt"
            git fetch origin main
            git reset --hard origin/main
            python3 .github/scripts/apply_gost_v135.py
            python3 - <<'PY'
from pathlib import Path
p = Path("БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED/groups/06_DATA_AND_PROOF_LEDGERS.md")
p.write_text(p.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
PY
            git diff --check

            mapfile -t changed < <(git diff --name-only | sort)
            mapfile -t expected < <(printf '%s\n' "${paths[@]}" | sort)
            if [[ "${changed[*]}" != "${expected[*]}" ]]; then
              echo "Unexpected changed-file set"
              printf 'changed: %s\n' "${changed[@]}"
              printf 'expected: %s\n' "${expected[@]}"
              exit 1
            fi

            git add -- "${paths[@]}"
            git commit -m "research(baptists): resolve Gost congress numbering v135"
            if git push origin HEAD:main; then
              success=1
              break
            fi
            echo "push race; retrying on fresh main"
          done
          [[ "$success" -eq 1 ]]
