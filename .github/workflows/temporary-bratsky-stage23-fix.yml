name: Temporary Bratsky Stage23 fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/temporary-bratsky-stage23-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/bratsky-publication-authority-20260801
      - name: Repair one shifted CSV row
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          import io

          path = Path('RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PRIMARY_PAGE_MAP_STAGE23_2026-08-01.csv')
          target = 'BL23-1907-12-P08-09-KUZMIN'
          with path.open('r', encoding='utf-8', newline='') as handle:
              lines = handle.readlines()

          matches = [i for i, line in enumerate(lines) if line.startswith(target + ',')]
          if matches != [12]:
              raise SystemExit(f'unexpected target positions: {matches}')

          index = matches[0]
          line = lines[index]
          raw = line.rstrip('\r\n')
          ending = line[len(raw):]
          values = next(csv.reader([raw]))
          if len(values) != 13:
              raise SystemExit(f'expected 13 shifted columns, got {len(values)}')
          if values[:5] != [target, '1907', '12', '8-9', 'От брата В. Л. Кузьмина из Новгорода']:
              raise SystemExit(f'unexpected shifted prefix: {values[:5]!r}')
          if values[-3:] != ['7523727', '17', 'Числа и оценка воздействия проповеди являются миссионерским отчётом; фамилию Путухон проверить по латышским источникам.']:
              raise SystemExit(f'unexpected shifted suffix: {values[-3:]!r}')

          corrected = [
              target,
              '1907',
              '12',
              '8-9',
              'PDF 8-9',
              'От брата В. Л. Кузьмина из Новгорода',
              'В. Л. Кузьмин; Новгородский и Крестецкий уезды; брат Путухон; И. С. Громов; В. И. Долгополов',
              'За 18 дней Кузьмин посетил около 30 деревень и провёл 18 собраний; аудитории, по его сообщению, составляли примерно 125–350 человек. Упомянут латышский наставник баптистов Путухон и трудившиеся в отсутствие Кузьмина Громов и Долгополов.',
              'PRIMARY_PAGE_RANGE_VISUAL_CHECK',
              '1RGuAsiZ0qXBvBxMVaKLkxTe87P0k8dsx',
              '750b92b27612fac2025b9af2ab94f5c2ea50c19bf199f2c02779d4ea75bac2db',
              '7523727',
              '17',
              'Числа и оценка воздействия проповеди являются миссионерским отчётом; фамилию Путухон проверить по латышским источникам.',
          ]
          buffer = io.StringIO(newline='')
          csv.writer(buffer, lineterminator='\n').writerow(corrected)
          lines[index] = buffer.getvalue().rstrip('\n') + ending
          with path.open('w', encoding='utf-8', newline='') as handle:
              handle.writelines(lines)
          PY

          git diff --check
          test "$(git diff --numstat -- RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PRIMARY_PAGE_MAP_STAGE23_2026-08-01.csv | awk '{print $1 ":" $2}')" = "1:1"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PRIMARY_PAGE_MAP_STAGE23_2026-08-01.csv
          git commit -m 'research(bratsky): repair shifted Stage23 row'
          git push origin HEAD:agent/bratsky-publication-authority-20260801
