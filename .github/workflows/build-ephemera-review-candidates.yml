name: Build ephemera review candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-ephemera-review-candidates.yml'
      - 'SOURCE_LIBRARY/tools/build_ephemera_review_candidates.py'
      - 'SOURCE_LIBRARY/EPHEMERA_REVIEW_WORKFLOW_2026-07-30.md'
      - 'requirements/source-audit.lock'
      - 'data/artifact-custody-policy-v2.json'

permissions:
  contents: read

jobs:
  build-review-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements/source-audit.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/source-audit.lock
      - name: Compile builder
        run: python -m py_compile SOURCE_LIBRARY/tools/build_ephemera_review_candidates.py
      - name: Build review package
        run: python SOURCE_LIBRARY/tools/build_ephemera_review_candidates.py --per-query 60 --minimum-ready 65 --output ephemera-review-output
      - name: Validate result and record temporary custody
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('ephemera-review-output')
          data = json.loads((root / 'ephemera-candidates.json').read_text(encoding='utf-8'))
          if data['review_ready'] < 65:
              raise SystemExit(f"review-ready gate failed: {data['review_ready']}")
          custody = {
              'state': 'EPHEMERAL_ACTION_ARTIFACT',
              'publicationEligible': False,
              'retentionDays': 30,
              'durableReceiptPresent': False,
              'policy': 'data/artifact-custody-policy-v2.json'
          }
          (root / 'CUSTODY.json').write_text(json.dumps(custody, indent=2), encoding='utf-8')
          PY
      - name: Add reproducibility witnesses
        run: |
          git rev-parse HEAD > ephemera-review-output/RESEARCH_COMMIT.txt
          python -m pip freeze > ephemera-review-output/PIP_FREEZE.txt
          sha256sum requirements/source-audit.lock > ephemera-review-output/DEPENDENCY_LOCK_SHA256.txt
      - name: Upload temporary review package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ephemeral-ephemera-review-candidates
          path: ephemera-review-output/
          if-no-files-found: error
          retention-days: 30
      - name: Ensure builder is read-only
        run: git diff --exit-code
