name: OSK Wave 9 Modern Diotrophes Outline

on:
  pull_request:
    paths:
      - '00_RESEARCH_CURRENT_AUTHORITY_2026-08-01.md'
      - 'data/repository-evidence-policy-v2.json'
      - 'data/osk-source-registry-core-*-2026-08-01.json'
      - 'data/osk-wave2-source-registry-*-2026-08-01.json'
      - 'data/osk-wave7-article-audit-source-registry-2026-08-01.json'
      - 'data/osk-wave9-modern-diotrophes-source-manifest-2026-08-01.json'
      - 'data/osk-wave9-modern-diotrophes-outline-2026-08-01.json'
      - 'scripts/validate_osk_wave9_modern_diotrophes.py'
      - 'ОБРАТНАЯ СТОРОНА КАФЕДРЫ СЕРИЯ/42_WAVE9_MODERN_DIOTROPHES_EDITORIAL_OUTLINE_2026-08-01.md'
      - '.github/workflows/osk-wave9-modern-diotrophes.yml'
  push:
    branches: [main]
    paths:
      - '00_RESEARCH_CURRENT_AUTHORITY_2026-08-01.md'
      - 'data/repository-evidence-policy-v2.json'
      - 'data/osk-source-registry-core-*-2026-08-01.json'
      - 'data/osk-wave2-source-registry-*-2026-08-01.json'
      - 'data/osk-wave7-article-audit-source-registry-2026-08-01.json'
      - 'data/osk-wave9-modern-diotrophes-source-manifest-2026-08-01.json'
      - 'data/osk-wave9-modern-diotrophes-outline-2026-08-01.json'
      - 'scripts/validate_osk_wave9_modern_diotrophes.py'
      - 'ОБРАТНАЯ СТОРОНА КАФЕДРЫ СЕРИЯ/42_WAVE9_MODERN_DIOTROPHES_EDITORIAL_OUTLINE_2026-08-01.md'
      - '.github/workflows/osk-wave9-modern-diotrophes.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile validator
        run: python3 -m py_compile scripts/validate_osk_wave9_modern_diotrophes.py
      - name: Validate transitive 148-source editorial outline
        run: python3 scripts/validate_osk_wave9_modern_diotrophes.py
      - name: Ensure validator is read-only
        run: git diff --exit-code
