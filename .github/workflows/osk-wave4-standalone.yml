name: OSK Wave 4 Standalone Authority

on:
  pull_request:
    paths:
      - '00_RESEARCH_CURRENT_AUTHORITY_2026-08-01.md'
      - 'ОБРАТНАЯ СТОРОНА КАФЕДРЫ СЕРИЯ/38_WAVE4_STANDALONE_PASTORAL_CARE_LEGAL_2026-08-01.md'
      - 'data/osk-wave4-decisions-2026-08-01.json'
      - 'data/osk-wave4-source-registry-2026-08-01.json'
      - 'data/osk-wave4-source-registry-*-2026-08-01.json'
      - 'scripts/validate_osk_wave4_standalone.py'
      - '.github/workflows/osk-wave4-standalone.yml'
  push:
    branches: [main]
    paths:
      - '00_RESEARCH_CURRENT_AUTHORITY_2026-08-01.md'
      - 'ОБРАТНАЯ СТОРОНА КАФЕДРЫ СЕРИЯ/38_WAVE4_STANDALONE_PASTORAL_CARE_LEGAL_2026-08-01.md'
      - 'data/osk-wave4-decisions-2026-08-01.json'
      - 'data/osk-wave4-source-registry-2026-08-01.json'
      - 'data/osk-wave4-source-registry-*-2026-08-01.json'
      - 'scripts/validate_osk_wave4_standalone.py'
      - '.github/workflows/osk-wave4-standalone.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile validator
        run: python -m py_compile scripts/validate_osk_wave4_standalone.py
      - name: Validate Wave 4 authority
        run: python scripts/validate_osk_wave4_standalone.py
