name: Download approved 63 ephemera originals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/download-approved-ephemera-originals.yml'
      - 'SOURCE_LIBRARY/tools/download_approved_ephemera_originals.py'
      - 'SOURCE_LIBRARY/processed/APPROVED_EPHEMERA_63_ALLOWLIST_2026-07-30.md'

permissions:
  contents: read

concurrency:
  group: approved-ephemera-originals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  download-and-verify:
    name: Download 63 reviewed open-license originals
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Recheck licenses and download originals
        run: >-
          python SOURCE_LIBRARY/tools/download_approved_ephemera_originals.py
          --output approved-ephemera-originals
          --max-file-mb 100
          --pause 0.35

      - name: Publish summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open('approved-ephemera-originals/manifest.json', encoding='utf-8'))
          print('# Approved ephemera originals')
          print(f"- selected: **{data['selected']}**")
          print(f"- downloaded: **{data['downloaded']}**")
          print(f"- total bytes: **{data['total_bytes']}**")
          print(f"- licenses: `{data['license_counts']}`")
          print(f"- topics: `{data['topic_counts']}`")
          print(f"- statuses: `{data['status_counts']}`")
          PY

      - name: Split originals into connector-safe parts
        shell: bash
        run: |
          root='approved-ephemera-originals'
          for part in 1 2 3 4; do mkdir -p "$root/chunks/part-$part"; done
          shopt -s nullglob
          for file in "$root"/[0-9][0-9][0-9]__*; do
            base=$(basename "$file")
            number=${base%%__*}
            index=$((10#$number))
            part=$(( (index - 1) / 16 + 1 ))
            mv "$file" "$root/chunks/part-$part/$base"
          done
          find "$root/chunks" -type f -printf '%p %s bytes\n' | sort

      - name: Upload originals part 1
        uses: actions/upload-artifact@v4
        with:
          name: approved-ephemera-originals-01-16
          path: approved-ephemera-originals/chunks/part-1/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload originals part 2
        uses: actions/upload-artifact@v4
        with:
          name: approved-ephemera-originals-17-32
          path: approved-ephemera-originals/chunks/part-2/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload originals part 3
        uses: actions/upload-artifact@v4
        with:
          name: approved-ephemera-originals-33-48
          path: approved-ephemera-originals/chunks/part-3/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload originals part 4
        uses: actions/upload-artifact@v4
        with:
          name: approved-ephemera-originals-49-63
          path: approved-ephemera-originals/chunks/part-4/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload manifest and rights ledger
        uses: actions/upload-artifact@v4
        with:
          name: approved-ephemera-originals-manifest
          path: |
            approved-ephemera-originals/manifest.json
            approved-ephemera-originals/manifest.csv
            approved-ephemera-originals/SHA256SUMS.txt
            approved-ephemera-originals/README.md
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
