name: Download approved 63 ephemera originals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/download-approved-ephemera-originals.yml'
      - 'SOURCE_LIBRARY/tools/download_approved_ephemera_originals.py'
      - 'SOURCE_LIBRARY/processed/APPROVED_EPHEMERA_63_ALLOWLIST_2026-07-30.md'
      - 'requirements/source-audit.lock'
      - 'data/artifact-custody-policy-v2.json'

permissions:
  contents: read

jobs:
  download-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements/source-audit.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/source-audit.lock
      - name: Compile downloader
        run: python -m py_compile SOURCE_LIBRARY/tools/download_approved_ephemera_originals.py
      - name: Recheck licenses and download originals
        run: python SOURCE_LIBRARY/tools/download_approved_ephemera_originals.py --output approved-ephemera-originals --max-file-mb 100 --pause 0.35
      - name: Enforce 63 records and record custody
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('approved-ephemera-originals')
          data = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          if data['selected'] != 63 or data['downloaded'] != 63:
              raise SystemExit(f"ephemera acquisition gate failed: {data['downloaded']}/{data['selected']}")
          (root / 'CUSTODY.json').write_text(json.dumps({
              'state': 'EPHEMERAL_ACTION_ARTIFACT',
              'publicationEligible': False,
              'retentionDays': 7,
              'durableReceiptPresent': False,
              'itemLevelRightsRechecked': True,
              'policy': 'data/artifact-custody-policy-v2.json'
          }, indent=2), encoding='utf-8')
          PY
      - name: Add reproducibility witnesses
        run: |
          git rev-parse HEAD > approved-ephemera-originals/RESEARCH_COMMIT.txt
          python -m pip freeze > approved-ephemera-originals/PIP_FREEZE.txt
          sha256sum requirements/source-audit.lock > approved-ephemera-originals/DEPENDENCY_LOCK_SHA256.txt
      - name: Upload temporary originals and manifest
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ephemeral-approved-ephemera-originals-63
          path: approved-ephemera-originals/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Ensure downloader is read-only
        run: git diff --exit-code
