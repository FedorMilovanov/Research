name: One-shot LX continuation record update

on:
  push:
    branches:
      - agent/1-enoch-lx-site-source-insertion-2026-07-27

permissions:
  contents: write

jobs:
  update-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/1-enoch-lx-site-source-insertion-2026-07-27
          fetch-depth: 0

      - name: Update exact site continuation state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-one-shot-lx-continuation-record.yml')
          record = Path('ТРУДНЫЕ ТЕКСТЫ/GENESIS6_LX_ARTICLES_6A_6B_CLAIM_LEVEL_SOURCE_INSERTION_IMPLEMENTATION_RECORD.md')
          source = record.read_text(encoding='utf-8')

          replacements = [
              ('**Site continuation PR:** `#457`', '**Site continuation PR:** `#460` — clean successor to diverged `#457`'),
              ('**Site branch:** `agent/genesis-6-enoch-claim-footnotes-2026-07-27`', '**Site branch:** `agent/genesis-6-enoch-source-audit-continuation-2026-07-28`'),
              ('**Проверяемый site head:** `5864fdeb8e9ef7499420a51b35021e62bca151cc`', '**Проверяемый site head:** `4cbaaa9f222de77341bb9190f9ff84d499715b7c`'),
              ('**Итоговый content blob:** `1be808a1c7b003de836c105d096eee1c42dbf2a4`', '**Итоговый content blob:** `4896a78591538f56a1a5f1db35131d12677d7c70`'),
              ('**Итоговый content blob:** `ac4dbfa4a840f19c81936ce7f5571f6e6a3f48f4`', '**Итоговый content blob:** `c57db2e7c8a5140fdf96869794d284128653630c`'),
              ('На exact site head `5864fdeb8e9ef7499420a51b35021e62bca151cc` Genesis 6 Research provenance завершился успешно, включая legacy authority, extension authority, footnote integrity gate и exact pinned provenance.', 'На прежнем exact site head `5864fdeb8e9ef7499420a51b35021e62bca151cc` Genesis 6 Research provenance завершился успешно. После расхождения site `main` работа перенесена без force push на PR `#460`; exact post-audit head `4cbaaa9f222de77341bb9190f9ff84d499715b7c` должен оцениваться только по собственным workflow этого head.'),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact match, found {count}: {old[:140]}')
              source = source.replace(old, new, 1)

          appendix = '''

---

## 8. Продолжение LX: микроаудит библиографических формул

**Дата продолжения:** 28 июля 2026 года  
**Site PR:** `FedorMilovanov/gb-is-my-strength#460`  
**Exact site head:** `4cbaaa9f222de77341bb9190f9ff84d499715b7c`  
**6A blob:** `4896a78591538f56a1a5f1db35131d12677d7c70`  
**6B blob:** `c57db2e7c8a5140fdf96869794d284128653630c`

После того как прежний site PR `#457` стал `3 ahead / 2 behind` относительно текущего `main`, была создана новая clean continuation branch от exact `main` без force push и без изменения старой ветки.

Проверены все 53 reader-facing source groups:

- 6A — 27 групп;
- 6B — 26 групп;
- нумерация и количество не менялись;
- `draft`, `noindex`, `sourcesRequired` и `releaseState: blocked` сохранены;
- named textual, composition, dating и rights `HOLD` не сняты.

Исправлены reader-facing формулы:

1. 6A `[^16]` — удалена внутренняя ссылка на `Research dossier`; неподтверждённый сильный тезис о календарных сборниках ослаблен до документированной множественности геэз-передачи.
2. 6A `[^24]` — расплывчатые «критические реестры» заменены публичной ролью OCP bibliography.
3. 6B `[^10]` — перечень чтений обозначен как редакторская карта гипотез, а не научный консенсус.
4. 6B `[^11]` — удалена расплывчатая ссылка на «древние версии»; version control честно оставлен `HOLD`.
5. 6B `[^26]` — внутренние Research filenames заменены публичной текстологической методикой и явным разделением источникового факта и конфессиональной оценки.

Этот раздел остаётся implementation record и не создаёт новую исследовательскую власть. Технический успех CI не закрывает богословские, текстологические, правовые или публикационные границы.
'''

          if '## 8. Продолжение LX: микроаудит библиографических формул' in source:
              raise SystemExit('continuation appendix already exists')
          source = source.rstrip() + appendix + '\n'
          record.write_text(source, encoding='utf-8')
          workflow.unlink()
          PY

          git diff --check

      - name: Commit record update and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'ТРУДНЫЕ ТЕКСТЫ/GENESIS6_LX_ARTICLES_6A_6B_CLAIM_LEVEL_SOURCE_INSERTION_IMPLEMENTATION_RECORD.md' \
            .github/workflows/agent-one-shot-lx-continuation-record.yml
          git commit -m "research(enoch): update LX record for clean source-audit continuation"
          git push origin HEAD:agent/1-enoch-lx-site-source-insertion-2026-07-27
