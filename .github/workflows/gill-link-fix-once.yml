name: One-shot Gill primary link strengthening

on:
  push:
    branches:
      - agent/gill-link-health-closure-2026-07-24

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gill-link-health-closure-2026-07-24
      - name: Replace gateway with direct Angus facsimiles
        shell: python
        run: |
          from pathlib import Path

          ledger = Path('Джон Гилл/72_PRIMARY_SOURCE_40_PLUS_DIRECT_LINK_LEDGER_AND_CLOSURE.md')
          s = ledger.read_text(encoding='utf-8')
          row44 = '| 44 | [First London Baptist Confession, 1644 — исторические сканы](https://www.thecalvinist.net/post/first-london-baptist-confession-1644-1646) | A1 | Раннее самоописание Particular Baptists | Современная страница — только шлюз; использовать вложенные сканы |'
          row45 = '| 45 | [First London Baptist Confession, 1646 — исторический скан](https://www.thecalvinist.net/post/first-london-baptist-confession-1644-1646) | A1 | Пересмотренное исповедное самоописание | Не смешивать редакции 1644 и 1646 |'
          new44 = '| 44 | First London Baptist Confession, 1644 — Angus facsimile: [часть 1](https://www.london1644.info/documents/1LCF-1644-Facsimile-1.pdf), [часть 2](https://www.london1644.info/documents/1LCF-1644-Facsimile-2.pdf) | A1 | Раннее самоописание Particular Baptists | Две части одного исторического экземпляра; не смешивать со сводной редакцией 2022 года |'
          new45 = '| 45 | [First London Baptist Confession, 1646 — полный Angus facsimile](https://www.london1644.info/documents/1LCF-1646-Facsimile.pdf) | A1 | Пересмотренное исповедное самоописание | Не смешивать редакции 1644 и 1646 |'
          if row44 not in s or row45 not in s:
              raise SystemExit('expected confession rows not found')
          ledger.write_text(s.replace(row44, new44).replace(row45, new45), encoding='utf-8')

          nav = Path('Джон Гилл/00_README_AND_NAVIGATION.md')
          s = nav.read_text(encoding='utf-8')
          anchor = '| 72 | `72_PRIMARY_SOURCE_40_PLUS_DIRECT_LINK_LEDGER_AND_CLOSURE.md` | Первичный реестр 56 точек | Прямые оригиналы, границы вывода и закрытие долгов |'
          row73 = '| 73 | `73_PRIMARY_LINK_HEALTH_60_UNIQUE_URL_ACCEPTANCE.md` | Приёмка 60 уникальных URL | Двухпроходная проверка ссылок и прямые Angus facsimiles |'
          if row73 not in s:
              if anchor not in s:
                  raise SystemExit('navigation anchor not found')
              s = s.replace(anchor, anchor + '\n' + row73)
          s = s.replace('`67`, `70`–`72`.', '`67`, `70`–`73`.')
          nav.write_text(s, encoding='utf-8')
      - name: Self-remove and commit
        run: |
          git rm .github/workflows/gill-link-fix-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(gill): strengthen confession links and navigation'
          git push origin HEAD:agent/gill-link-health-closure-2026-07-24
