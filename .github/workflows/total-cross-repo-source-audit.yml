name: Total cross-repo source audit

on:
  pull_request:
    paths:
      - 'SOURCE_LIBRARY/tools/total_cross_repo_source_audit.py'
      - 'SOURCE_LIBRARY/tools/refine_total_cross_repo_audit.py'
      - 'SOURCE_LIBRARY/tools/classify_dead_source_urls.py'
      - 'SOURCE_LIBRARY/audit-baseline.json'
      - 'requirements/source-audit.lock'
      - '.github/workflows/total-cross-repo-source-audit.yml'
  push:
    branches: [main]
    paths:
      - 'SOURCE_LIBRARY/tools/total_cross_repo_source_audit.py'
      - 'SOURCE_LIBRARY/tools/refine_total_cross_repo_audit.py'
      - 'SOURCE_LIBRARY/tools/classify_dead_source_urls.py'
      - 'SOURCE_LIBRARY/audit-baseline.json'
      - 'requirements/source-audit.lock'
      - '.github/workflows/total-cross-repo-source-audit.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: total-cross-repo-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Scan four repositories and enforce source baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout committed audit code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements/source-audit.lock

      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/source-audit.lock

      - name: Compile committed auditors
        run: |
          python -m py_compile \
            SOURCE_LIBRARY/tools/total_cross_repo_source_audit.py \
            SOURCE_LIBRARY/tools/refine_total_cross_repo_audit.py \
            SOURCE_LIBRARY/tools/classify_dead_source_urls.py

      - name: Run deterministic total audit
        env:
          URL_AUDIT_CAP: '1200'
          URL_AUDIT_WORKERS: '24'
          AUDIT_BASELINE: 'SOURCE_LIBRARY/audit-baseline.json'
          MAX_NEW_DEAD: '0'
          MAX_NEW_MISSING_LOCAL: '0'
          MAX_NEW_PUBLICATION_PROVENANCE: '0'
        run: |
          set +e
          python SOURCE_LIBRARY/tools/total_cross_repo_source_audit.py
          code=$?
          set -e
          mkdir -p total-audit-output
          printf '%s\n' "$code" > total-audit-output/RAW_AUDIT_EXIT_CODE.txt
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::raw source auditor crashed with unexpected exit code $code"
            exit "$code"
          fi
          if [ "$code" -eq 2 ]; then
            echo "::notice::raw heuristic gate reported a classified-baseline mismatch; authoritative enforcement is deferred to the committed refined/classifier outputs below"
          fi

      - name: Run refined source-only audit
        env:
          REFINED_URL_AUDIT_CAP: '2500'
          REFINED_URL_AUDIT_WORKERS: '36'
        run: python SOURCE_LIBRARY/tools/refine_total_cross_repo_audit.py

      - name: Classify true dead sources
        run: python SOURCE_LIBRARY/tools/classify_dead_source_urls.py

      - name: Evaluate classified source baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('total-audit-output')
          baseline = json.loads(Path('SOURCE_LIBRARY/audit-baseline.json').read_text(encoding='utf-8'))
          refined = json.loads((root / 'refined' / 'refined_summary.json').read_text(encoding='utf-8'))
          dead = json.loads((root / 'dead-url-classification' / 'summary.json').read_text(encoding='utf-8'))
          raw = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          raw_exit = int((root / 'RAW_AUDIT_EXIT_CODE.txt').read_text(encoding='utf-8').strip())

          metrics = {
              'high_priority_dead': int(refined.get('high_priority_dead', 0)),
              'true_dead_source_repair': int(dead.get('counts', {}).get('TRUE_DEAD_SOURCE_REPAIR', 0)),
              'likely_missing_file_references': int(refined.get('missing_classification', {}).get('LIKELY_MISSING_FILE_REFERENCE', 0)),
              'publication_assets_without_provenance': int(refined.get('asset_classification', {}).get('PUBLICATION_ASSET_ADD_PROVENANCE_LEDGER', 0)),
          }
          limits = {
              'high_priority_dead': int(baseline['dead_urls']),
              'true_dead_source_repair': int(baseline['true_dead_source_repair']),
              'likely_missing_file_references': int(baseline['missing_local_links']),
              'publication_assets_without_provenance': int(baseline['publication_assets_without_provenance']),
          }
          failures = [
              f'{key}: {metrics[key]} > baseline {limits[key]}'
              for key in metrics
              if metrics[key] > limits[key]
          ]
          receipt = {
              'schemaVersion': 1,
              'authority': baseline.get('authority'),
              'raw_audit_exit_code': raw_exit,
              'raw_diagnostic_counts': {
                  'dead': int(raw.get('url_status', {}).get('DEAD', 0)),
                  'missing_local': int(raw.get('missing_local', 0)),
                  'publication_assets_without_provenance': int(raw.get('publication_assets_without_provenance', 0)),
              },
              'classified_metrics': metrics,
              'classified_limits': limits,
              'failures': failures,
              'ok': not failures,
          }
          (root / 'CLASSIFIED_BASELINE_GATE.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('CLASSIFIED_BASELINE_EVALUATION', json.dumps(receipt, ensure_ascii=False))
          PY

      - name: Show executive reports
        run: |
          sed -n '1,220p' total-audit-output/TOTAL_CROSS_REPO_SOURCE_AUDIT.md
          printf '\n--- REFINED ---\n'
          sed -n '1,240p' total-audit-output/refined/REFINED_TOTAL_SOURCE_AUDIT.md
          printf '\n--- DEAD URL CLASSIFICATION ---\n'
          cat total-audit-output/dead-url-classification/DEAD_URL_CLASSIFICATION.md
          printf '\n--- CLASSIFIED BASELINE GATE ---\n'
          cat total-audit-output/CLASSIFIED_BASELINE_GATE.json

      - name: Show actionable gate queues
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          missing_path = Path('total-audit-output/refined/classified_missing_local_links.csv')
          dead_path = Path('total-audit-output/dead-url-classification/true_dead_source_repair_queue.csv')

          print('--- LIKELY_MISSING_FILE_REFERENCE rows ---')
          with missing_path.open(encoding='utf-8-sig', newline='') as handle:
              for row in csv.DictReader(handle):
                  if row.get('classification') == 'LIKELY_MISSING_FILE_REFERENCE':
                      print('ACTIONABLE_MISSING', json.dumps(row, ensure_ascii=False, sort_keys=True))

          print('--- TRUE_DEAD_SOURCE_REPAIR rows ---')
          with dead_path.open(encoding='utf-8-sig', newline='') as handle:
              for row in csv.DictReader(handle):
                  print('ACTIONABLE_DEAD', json.dumps(row, ensure_ascii=False, sort_keys=True))
          PY

      - name: Build reproducibility manifest
        run: |
          cp SOURCE_LIBRARY/tools/total_cross_repo_source_audit.py total-audit-output/
          cp SOURCE_LIBRARY/tools/refine_total_cross_repo_audit.py total-audit-output/
          cp SOURCE_LIBRARY/tools/classify_dead_source_urls.py total-audit-output/
          cp requirements/source-audit.lock total-audit-output/
          cp SOURCE_LIBRARY/audit-baseline.json total-audit-output/
          git rev-parse HEAD > total-audit-output/RESEARCH_COMMIT.txt
          python -m pip freeze > total-audit-output/PIP_FREEZE.txt
          sha256sum requirements/source-audit.lock > total-audit-output/DEPENDENCY_LOCK_SHA256.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, platform, sys
          root = Path('total-audit-output')
          rows = []
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  rows.append({
                      'file': path.relative_to(root).as_posix(),
                      'size_bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
          metadata = {
              'python': sys.version,
              'platform': platform.platform(),
              'files': rows,
          }
          (root / 'PACKAGE_MANIFEST.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          PY

      - name: Ensure audit execution was read-only
        run: git diff --exit-code

      - name: Upload total audit evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: total-cross-repo-source-audit
          path: total-audit-output/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce classified source baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          receipt = json.loads(Path('total-audit-output/CLASSIFIED_BASELINE_GATE.json').read_text(encoding='utf-8'))
          if not receipt.get('ok'):
              for failure in receipt.get('failures', []):
                  print(f'GATE_FAILURE: {failure}')
              raise SystemExit(2)
          print('CLASSIFIED_BASELINE_GATE_OK', json.dumps(receipt['classified_metrics'], ensure_ascii=False))
          PY
