name: Atonement corpus integrity

# ИСКУПЛЕНИЕ/ (particular vs universal atonement) — structural gate over main's canonical
# corpus plus the adjacent polemic lane docs/research/atonement/.
# Read-only validator: no writes, no artifacts, no EPHEMERAL_ACTION_ARTIFACT by design.
# It asserts structure and publication boundaries only; it never states a theological verdict.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '37 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atonement-corpus-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # имя job'а = имя required-check'а в GitHub. В репозитории три workflow'а уже называют
  # свой job «validate»; четвёртый с тем же именем сделал бы список защищённых проверок
  # неразрешимым, поэтому контекст назван явно.
  atonement-corpus-integrity:
    name: Atonement corpus integrity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Полная история нужна не гейту-по-файлам, а проверке записанных в реестре время` коммитов:
          # в shallow-клоне git не видит предков, и ровно так в песочнице два дня рождались
          # «unrelated histories» вместо 0 конфликтов.
          fetch-depth: 0

      - name: refuse a history-blind checkout
        run: |
          test "$(git rev-parse --is-shallow-repository)" = "false" || {
            echo "::error::checkout shallow — git-замеры по истории в таком клоне врут (merge-base пуст)"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate Python syntax without writing bytecode
        run: >-
          python3 -B -m py_compile scripts/validate_atonement_corpus_integrity.py
          scripts/atonement_claim_register.py scripts/atonement_reshoot_state.py
          scripts/atonement_drive_mirror_round63.py scripts/atonement_library_index_round63.py
          scripts/atonement_round_close.py scripts/atonement_history_perturbation_probe.py

      - name: Atonement corpus integrity (read-only)
        run: python3 -B scripts/validate_atonement_corpus_integrity.py

      # Числа, которые живут и в реестре, и в прозе аудита, переснимает скрипт; этот шаг не даёт
      # им протухать: без него «счётчик есть в реестре» означает «кто-то когда-то посчитал» (круг 63
      # нашёл в §1 123 записи при 124 в дереве — и ни одна проверка об этом не сообщила).
      # Порядок закрытия круга — тоже инструмент: он обязан быть исполнимым и безвредным в режиме
      # плана, иначе «сходимость» остаётся знанием автора круга, а круг 62 показал, что это за знание.
      - name: Close-round order is inert and refuses the appending writers
        run: |
          python3 -B scripts/atonement_round_close.py --plan > /dev/null
          python3 -B scripts/atonement_round_close.py --selfcheck
          rc=0
          python3 -B scripts/atonement_round_close.py --run --allow-appending-writers >/dev/null 2>&1 || rc=$?
          test "$rc" = 2 || { echo "::error::писатели без подтверждения круга должны давать отказ с кодом 2, получили $rc"; exit 1; }
      # Круг 64 запретил числа истории в сверяемых полях по *имени* поля. Имя — список, а список
      # всегда отстаёт от изобретательности: счётчик, названный иначе, проходит незамеченным. Этот шаг
      # говорит то же самое поведением: проб строит три среды над одним деревом (контроль, та же
      # версия при `origin/main` на один коммит длиннее, и клон глубиной в один коммит) и требует,
      # чтобы числа вели себя согласно объявлению: в полной среде — не шевельнуться, в неполной —
      # отказаться и назвать причину словами. Молчаливый PASS в неполном клоне — тот же грех, что и
      # тихое «совпало» над пустым обходом. Шаг стоит до «read-only» сверки: она обязана заодно
      # подтвердить, что проб не написал в проверяемое дерево ни байта.
      - name: History perturbation probe (numbers must not move with history)
        run: |
          git remote set-branches --add origin main 2>/dev/null || true
          git -c gc.auto=0 fetch -q origin "+refs/heads/main:refs/remotes/origin/main" || true
          git show-ref --verify --quiet refs/remotes/origin/main || {
            echo "::error::нет refs/remotes/origin/main — проб истории нечем мерить"; exit 1; }
          python3 -B scripts/atonement_history_perturbation_probe.py --verdicts
          python3 -B scripts/atonement_history_perturbation_probe.py HEAD --selftest
      # Круг 65 смягчил правило «имя блока против его штампа» с равенства на порядок. Смягчённое
      # правило без посадочного места тихо вырождается в молчание: обход перестаёт видеть ключи,
      # `bad` пуст, `checked` ноль, а сверка печатает «0 расхождений из 0». Этот шаг исполняет
      # ловушку: незаконный порядок обязан быть пойман, законный — нет, и блоки обязаны быть увидены.
      - name: Date-rule trap (a relaxed rule must still bite)
        run: python3 -B scripts/atonement_reshoot_state.py --rule-trap
      - name: Read-only re-shoot check
        run: python3 -B scripts/atonement_reshoot_state.py --check
      - name: Claim register is resolved and cross-checked
        run: |
          python3 -B scripts/atonement_claim_register.py --check
          python3 -B scripts/atonement_claim_register.py --cross
      - name: Ensure the re-shoot tools are read-only and not hollowed out
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)" || { echo "::error::шаг --check что-то записал — он обязан сверять"; exit 1; }
          grep -q 'ATONEMENT RE-SHOOT: PASS' scripts/atonement_reshoot_state.py
          grep -q 'pipelineScripts' scripts/atonement_reshoot_state.py
          grep -q 'число обхода в сверяемом поле' scripts/atonement_reshoot_state.py
          grep -q 'allow-appending-writers' scripts/atonement_round_close.py
          grep -q 'ОТКАЗ СРЕДЫ' scripts/atonement_round_close.py
          grep -q 'PROBE' scripts/atonement_round_close.py
          grep -q 'ПРОБ ИСТОРИИ: PASS' scripts/atonement_history_perturbation_probe.py
          # сводка доводов обязана иметь производителя в том же файле, что её снимает: правило 27
          # сравнивает число, а пересъёмщик его не трогает — без этих двух строк сводка снова
          # становится тем, что кто-то однажды вписал с экрана
          grep -q 'def write_rollup' scripts/atonement_claim_register.py
          grep -q 'claimsPerRegistry' scripts/atonement_claim_register.py
          grep -q 'СРЕДА НЕГОДНА' scripts/atonement_history_perturbation_probe.py
          grep -q 'ЛОВУШКА НЕ ПОДТВЕРЖДЕНА' scripts/atonement_history_perturbation_probe.py
          grep -q 'def keydate_trap' scripts/atonement_reshoot_state.py
          grep -q 'ЛОВУШКА ПРАВИЛА ДАТ' scripts/atonement_reshoot_state.py
          grep -q 'def verdicts' scripts/atonement_history_perturbation_probe.py
      # Мерж обязан быть зелёным не только на ветке: проверка накладывается на дерево main в worktree.
      # Иначе «аддитивный» слой мог бы внести в каноническое дерево падения по чужим файлам, и первый
      # же плановый прогон на main обвинил бы в этом владельцев тех ланов.
      - name: Preview landing on main
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch -q --no-tags origin main
          BASE=$(git rev-parse FETCH_HEAD)
          WT=$(mktemp -d)
          git worktree add -q --detach "$WT" "$BASE"
          git -c core.quotepath=off diff --name-only "$BASE" "${GITHUB_SHA}" > /tmp/pr-files.txt
          n=0; d=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mkdir -p "$WT/$(dirname "$f")"
            if git cat-file -e "${GITHUB_SHA}:${f}" 2>/dev/null; then
              git show "${GITHUB_SHA}:${f}" > "$WT/${f}"; n=$((n+1))
            else
              rm -f "$WT/${f}"; d=$((d+1))
            fi
          done < /tmp/pr-files.txt
          echo "наложено файлов: ${n}, удалено: ${d}"
          test "$((n+d))" -gt 0 || { echo "::error::diff с main пуст — проверять нечего, шаг выродился в декорацию"; exit 1; }
          ( cd "$WT" && python3 scripts/validate_atonement_corpus_integrity.py )
      # гейт не может проверить себя изнутри: если файл заменят заглушкой, шаг выше промолчит
      - name: refuse a hollowed-out gate
        run: |
          grep -q 'publicationEligible=false' scripts/validate_atonement_corpus_integrity.py
          grep -q 'ATONEMENT CORPUS INTEGRITY: PASS' scripts/validate_atonement_corpus_integrity.py
