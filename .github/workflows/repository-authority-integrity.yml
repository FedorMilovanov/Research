name: Repository authority integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-authority-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete Research history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          path: Research

      - name: Fetch pinned Bratsky Stage 23 witness
        run: |
          git -C Research cat-file -e 'f3601a30f071385da8987acf1d96090b28a6af52^{commit}' || \
            git -C Research fetch --no-tags --depth=1 origin f3601a30f071385da8987acf1d96090b28a6af52
          git -C Research cat-file -e 'f3601a30f071385da8987acf1d96090b28a6af52^{commit}'

      - name: Checkout exact Product snapshot with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FedorMilovanov/gb-is-my-strength
          ref: efaf2a51b1fcc7b7d3f8c9558ecb5acf849df3b3
          fetch-depth: 0
          path: Product
          persist-credentials: false

      - name: Fetch pinned Gill Product witness
        run: |
          git -C Product cat-file -e '433c76ddd4ee37e9efe8fd4f5fc7573aa8e2a736^{commit}' || \
            git -C Product fetch --no-tags --depth=1 origin 433c76ddd4ee37e9efe8fd4f5fc7573aa8e2a736
          git -C Product cat-file -e '433c76ddd4ee37e9efe8fd4f5fc7573aa8e2a736^{commit}'

      - name: Validate Python syntax without writing bytecode
        working-directory: Research
        run: |
          for path in \
            scripts/validate_repository_authority_integrity.py \
            scripts/validate_public_projection_queue.py \
            scripts/validate_osk_wave7_product_article_audit.py \
            scripts/validate_osk_wave9_modern_diotrophes.py \
            scripts/validate_osk_wave10_faithful_witness.py \
            scripts/validate_bratsky_listok_authority_manifest.py \
            scripts/validate_genesis6_authority_manifest.py \
            scripts/check_heart_source_closure.py \
            scripts/normalize_baptist_proof_ledger.py
          do
            python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); compile(p.read_text(encoding="utf-8"), str(p), "exec")' "$path"
          done

      - name: Validate repository control plane
        working-directory: Research
        env:
          PRODUCT_REPO: ../Product
          GILL_PRODUCT_REPO: ../Product
        run: python3 scripts/validate_repository_authority_integrity.py

      - name: Run deterministic corpus validators
        working-directory: Research
        env:
          PRODUCT_REPO: ../Product
          GILL_PRODUCT_REPO: ../Product
        run: |
          python3 scripts/validate_public_projection_queue.py
          python3 scripts/validate_osk_wave7_product_article_audit.py
          python3 scripts/validate_osk_wave9_modern_diotrophes.py
          python3 scripts/validate_osk_wave10_faithful_witness.py
          python3 scripts/validate_bratsky_listok_authority_manifest.py
          python3 scripts/validate_genesis6_authority_manifest.py
          python3 scripts/check_heart_source_closure.py
          python3 scripts/normalize_baptist_proof_ledger.py
          node scripts/gill-pr2-lossless-reconciliation-audit.mjs

      - name: Ensure all validators and checkouts are read-only
        run: |
          git -C Research diff --exit-code
          git -C Product diff --exit-code
          test -z "$(git -C Research status --porcelain)"
          test -z "$(git -C Product status --porcelain)"
