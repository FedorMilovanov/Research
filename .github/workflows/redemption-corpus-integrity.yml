name: Redemption corpus integrity

# ИСКУПЛЕНИЕ/ (redemption / particular-vs-universal atonement) — Wave 0 spine gate.
# Read-only validator: no writes, no artifacts.
# EPHEMERAL_ACTION_ARTIFACT: none produced by design.
# publicationEligible: false at Wave 0; the gate asserts it and must never be edited to say otherwise.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/redemption-corpus-integrity.yml'
      - 'data/redemption-corpus-authority-2026-10-07.json'
      - 'scripts/validate_redemption_corpus.py'
      - 'ИСКУПЛЕНИЕ/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/redemption-corpus-integrity.yml'
      - 'data/redemption-corpus-authority-2026-10-07.json'
      - 'scripts/validate_redemption_corpus.py'
      - 'ИСКУПЛЕНИЕ/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile validators without writing bytecode
        run: >-
          python3 -c 'from pathlib import Path; paths=[Path("scripts/validate_redemption_corpus.py"),Path("scripts/validate_repository_authority_integrity.py"),Path("scripts/validate_research_root_authority.py")]; [compile(p.read_text(encoding="utf-8"), str(p), "exec") for p in paths]'
      - name: Redemption corpus spine
        run: python3 scripts/validate_redemption_corpus.py
      - name: Repository authority integrity
        run: python3 scripts/validate_repository_authority_integrity.py
      - name: Research root authority
        run: python3 scripts/validate_research_root_authority.py
      - name: Read-only assertion
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
