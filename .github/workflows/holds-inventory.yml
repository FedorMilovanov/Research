name: Holds inventory (read-only)

on:
  pull_request:
    paths:
      - '.github/workflows/holds-inventory.yml'
      - 'data/repository-evidence-policy-v2.json'
      - 'data/repository-holds-inventory-v1.json'
      - 'data/hold-closure-registry-v1.json'
      - 'docs/research/HOLDS_REGISTER_2026-11-18.md'
      - 'scripts/audit_repository_holds.py'
      - 'scripts/test_audit_repository_holds.py'
      - 'scripts/audit_relative_links.py'
      - 'scripts/test_audit_relative_links.py'
      - 'data/relative-link-exceptions-v1.json'
      - 'scripts/check_hold_vocabulary.py'
      - 'scripts/test_check_hold_vocabulary.py'
      - 'data/hold-value-mapping-proposal-v1.json'
      - 'scripts/publication_gate_status.py'
      - 'scripts/test_publication_gate_status.py'
      - 'data/publication-gate-queue-v1.json'
      - 'scripts/verify_pinned_github_locators.py'
      - 'scripts/test_verify_pinned_github_locators.py'
      - 'scripts/test_hold_closure_registry.py'
      - 'data/hold-closure-registry-v1.json'
      - 'docs/research/HOLDS_REGISTER_2026-11-18.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/holds-inventory.yml'
      - 'data/repository-evidence-policy-v2.json'
      - 'data/repository-holds-inventory-v1.json'
      - 'data/hold-closure-registry-v1.json'
      - 'docs/research/HOLDS_REGISTER_2026-11-18.md'
      - 'scripts/audit_repository_holds.py'
      - 'scripts/test_audit_repository_holds.py'
      - 'scripts/audit_relative_links.py'
      - 'scripts/test_audit_relative_links.py'
      - 'data/relative-link-exceptions-v1.json'
      - 'scripts/check_hold_vocabulary.py'
      - 'scripts/test_check_hold_vocabulary.py'
      - 'data/hold-value-mapping-proposal-v1.json'
      - 'scripts/publication_gate_status.py'
      - 'scripts/test_publication_gate_status.py'
      - 'data/publication-gate-queue-v1.json'
      - 'scripts/verify_pinned_github_locators.py'
      - 'scripts/test_verify_pinned_github_locators.py'
      - 'scripts/test_hold_closure_registry.py'
      - 'data/hold-closure-registry-v1.json'
      - 'docs/research/HOLDS_REGISTER_2026-11-18.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout Research
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile inventory tools
        run: |
          python3 -m py_compile scripts/audit_repository_holds.py
          python3 -m py_compile scripts/audit_relative_links.py
          python3 -m py_compile scripts/check_hold_vocabulary.py
          python3 -m py_compile scripts/publication_gate_status.py
          python3 -m py_compile scripts/verify_pinned_github_locators.py
          python3 -m py_compile scripts/test_hold_closure_registry.py
      - name: Test classification and read-only behaviour
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_audit_repository_holds.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_audit_relative_links.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_check_hold_vocabulary.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_publication_gate_status.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_verify_pinned_github_locators.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_hold_closure_registry.py' -v
      - name: Scan (must not touch the working tree)
        run: |
          python3 scripts/audit_repository_holds.py -o /tmp/holds-a.json
          python3 scripts/audit_repository_holds.py -o /tmp/holds-b.json
          cmp /tmp/holds-a.json /tmp/holds-b.json
          python3 scripts/audit_relative_links.py -o /tmp/links-a.json
          python3 scripts/audit_relative_links.py -o /tmp/links-b.json
          cmp /tmp/links-a.json /tmp/links-b.json
      - name: Reject working-tree changes
        run: git diff --exit-code
      - name: Reject unexplained dead locators
        run: python3 scripts/audit_relative_links.py --strict
      - name: Check non-canonical holds vocabulary coverage
        run: python3 -B scripts/check_hold_vocabulary.py --check
      - name: Check publication gate queue composition
        run: python3 -B scripts/publication_gate_status.py --check
      - name: Report counts without asserting closure
        run: |
          python3 scripts/audit_repository_holds.py --summary
          python3 scripts/audit_relative_links.py --summary
