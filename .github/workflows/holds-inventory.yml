permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout Research
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The text-integrity check needs the file's own history: without it a
          # glued token cannot be told apart from prose that was always written
          # that way, and the tool would report `not-checked` for everything.
          fetch-depth: 0
      - name: Compile inventory tools
        run: |
          python3 -m py_compile scripts/audit_repository_holds.py
          python3 -m py_compile scripts/audit_relative_links.py
          python3 -m py_compile scripts/check_hold_vocabulary.py
          python3 -m py_compile scripts/audit_ci_triggers.py
          python3 -m py_compile scripts/check_snapshot_freshness.py
          python3 -m py_compile scripts/publication_gate_status.py
          python3 -m py_compile scripts/verify_pinned_github_locators.py
          python3 -m py_compile scripts/test_hold_closure_registry.py
          python3 -m py_compile scripts/audit_text_integrity.py
          python3 -m py_compile scripts/verify_internal_digests.py
          python3 -m py_compile scripts/stepbible_subdataset_terms.py
          python3 -m py_compile scripts/check_official_core_reproducibility.py
      # A pull_request checkout is a synthetic merge commit. Dated snapshots belong to
      # the branch that authored them, so unrelated main changes must not make that branch
      # rewrite all reports. The PR head is therefore the blocking freshness boundary.
      - name: Gate dated snapshots at the PR head
        if: github.event_name == 'pull_request'
        env:
          SNAPSHOT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$SNAPSHOT_SHA^{commit}" || git fetch --no-tags origin "$SNAPSHOT_SHA"
          git worktree add --detach "$RUNNER_TEMP/holds-snapshot" "$SNAPSHOT_SHA"
          cd "$RUNNER_TEMP/holds-snapshot"
          python3 -B scripts/check_snapshot_freshness.py --check
          python3 -B scripts/render_closures_summary.py --check
          python3 -B scripts/audit_register_claims.py --check
      # A merged main tree legitimately contains files that were not in the PR-head
      # snapshot. Preserve that drift in the log, but do not turn it into a post-merge
      # failure that can only be "fixed" by chasing main in another commit.
      - name: Report dated snapshot drift after integration
        if: github.event_name != 'pull_request'
        run: python3 -B scripts/check_snapshot_freshness.py
      - name: Test classification and read-only behaviour
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_audit_repository_holds.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_audit_relative_links.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_check_hold_vocabulary.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_audit_ci_triggers.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_check_snapshot_freshness.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_publication_gate_status.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_verify_pinned_github_locators.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_hold_closure_registry.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_audit_text_integrity.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_verify_internal_digests.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_audit_document_twins.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_audit_state_stamps.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_audit_drive_ledger.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_render_closures_summary.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_audit_register_claims.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_stepbible_subdataset_terms.py' -v
          python3 -B -m unittest discover -s scripts -p 'test_check_official_core_reproducibility.py' -v
      - name: Scan (must not touch the working tree)
        run: |
          python3 scripts/audit_repository_holds.py -o /tmp/holds-a.json
          python3 scripts/audit_repository_holds.py -o /tmp/holds-b.json
          cmp /tmp/holds-a.json /tmp/holds-b.json
          python3 scripts/audit_relative_links.py -o /tmp/links-a.json
          python3 scripts/audit_relative_links.py -o /tmp/links-b.json
          cmp /tmp/links-a.json /tmp/links-b.json
      - name: Reject working-tree changes
        run: git diff --exit-code
      - name: Reject unexplained dead locators
        run: python3 scripts/audit_relative_links.py --strict
      - name: Check non-canonical holds vocabulary coverage
        run: python3 -B scripts/check_hold_vocabulary.py --check
      - name: Check the workflow's own trigger list
        run: python3 -B scripts/audit_ci_triggers.py --check
      - name: Reject new glued tokens in prose
        run: python3 -B scripts/audit_text_integrity.py --check
      - name: Reject stale digests in live documents
        run: python3 -B scripts/verify_internal_digests.py --check
      # Snapshot freshness is gated at the branch head above. The finding is reported,
      # not gated: one byte-identical pair currently carries no declaration, and that is
      # an open item for the lane owning its master index. Blocking on the finding would
      # invite the tool to edit somebody's index instead of reporting it.
      - name: Count document twins (report only)
        run: python3 -B scripts/audit_document_twins.py --summary
      # Snapshot freshness is gated above; the interpretation stays report only.
      # "Edited after its own stamp" needs a human to judge whether the later commit
      # changed the substance. Only an impossible stamp is an automatic defect.
      - name: Compare self-dating stamps with Git history (report only)
        run: python3 -B scripts/audit_state_stamps.py --summary
      # Freshness against the dated Drive snapshot is gated above; these findings stay
      # report only. No network: the snapshot is what Drive answered on its date, and a
      # current Drive answer must never be inferred from that historical evidence.
      - name: Reconcile Drive library ledger (report only)
        run: python3 -B scripts/audit_drive_ledger.py --snapshot data/drive-ledger-snapshot-2026-11-18.json --summary
      # A generated map that disagrees with the registry is the same defect as a stale
      # counter: it quotes an older state of the file it summarises. This one is gated.
      - name: Closure map matches the registry
        run: python3 -B scripts/render_closures_summary.py --check
      # A counter in prose has no expiry date; this is the only thing that gives it one.
      - name: Register counters match their artefacts
        run: python3 -B scripts/audit_register_claims.py --check
      - name: Check the pinned STEPBible terms snapshot
        run: python3 -B scripts/stepbible_subdataset_terms.py --check
      - name: Check the official-core carrier receipts
        run: python3 -B scripts/check_official_core_reproducibility.py --check
      - name: Check publication gate queue composition
        run: python3 -B scripts/publication_gate_status.py --check
      - name: Report counts without asserting closure
        run: |
          python3 scripts/audit_repository_holds.py --summary
          python3 scripts/audit_relative_links.py --summary
