name: Research Public Projection Authority

on:
  pull_request:
    branches: [main]
    paths:
      - '00_RESEARCH_CURRENT_AUTHORITY_2026-08-01.md'
      - 'PUBLIC_PROJECTION_CURRENT_AUTHORITY_2026-08-01.md'
      - 'PUBLIC_PROJECTION_OSK_WAVE6_OVERLAY_2026-08-01.md'
      - 'data/public-projection-current-2026-08-02.json'
      - 'data/public-projection-queue-2026-08-01.json'
      - 'data/public-projection-queue-2026-08-01.csv'
      - 'data/public-projection-osk-wave6-overlay-2026-08-01.json'
      - 'data/physical-rights-ledger-2026-08-01.json'
      - 'data/physical-rights-ledger-2026-08-01.csv'
      - 'scripts/validate_public_projection_queue.py'
      - '.github/workflows/public-projection-queue.yml'
  push:
    branches: [main]
    paths:
      - '00_RESEARCH_CURRENT_AUTHORITY_2026-08-01.md'
      - 'PUBLIC_PROJECTION_CURRENT_AUTHORITY_2026-08-01.md'
      - 'PUBLIC_PROJECTION_OSK_WAVE6_OVERLAY_2026-08-01.md'
      - 'data/public-projection-current-2026-08-02.json'
      - 'data/public-projection-queue-2026-08-01.json'
      - 'data/public-projection-queue-2026-08-01.csv'
      - 'data/public-projection-osk-wave6-overlay-2026-08-01.json'
      - 'data/physical-rights-ledger-2026-08-01.json'
      - 'data/physical-rights-ledger-2026-08-01.csv'
      - 'scripts/validate_public_projection_queue.py'
      - '.github/workflows/public-projection-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile validator
        run: python3 -m py_compile scripts/validate_public_projection_queue.py
      - name: Validate base + overlay current authority
        run: python3 scripts/validate_public_projection_queue.py
      - name: Ensure validator is read-only
        run: git diff --exit-code
