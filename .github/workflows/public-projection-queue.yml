name: Research Public Projection Authority

on:
  pull_request:
    branches:
      - main
    paths:
      - 'PUBLIC_PROJECTION_CURRENT_AUTHORITY_2026-08-01.md'
      - 'data/public-projection-queue-2026-08-01.json'
      - 'data/public-projection-queue-2026-08-01.csv'
      - 'data/physical-rights-ledger-2026-08-01.json'
      - 'data/physical-rights-ledger-2026-08-01.csv'
      - 'scripts/validate_public_projection_queue.py'
      - '.github/workflows/public-projection-queue.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-public-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projection-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.13'

      - name: Compile validator
        run: python -m py_compile scripts/validate_public_projection_queue.py

      - name: Validate queue, rights ledger and dashboard
        run: python scripts/validate_public_projection_queue.py

      - name: Ensure validation is read-only
        run: git diff --exit-code
