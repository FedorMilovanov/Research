name: Bratsky Listok authority manifest

on:
  pull_request:
    paths:
      - "data/repository-evidence-policy-v2.json"
      - "data/bratsky-listok-authority-manifest.json"
      - "data/bratsky-listok-publication-ledger.json"
      - "scripts/validate_bratsky_listok_authority_manifest.py"
      - "RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PUBLICATION_AUTHORITY_2026-08-01.md"
      - "RUSSIAN_BAPTISTS_ARCHIVE/bratsky_listok_primary_page_map_stage18_2026-07-31.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/bratsky_listok_primary_page_map_stage19_2026-07-31.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/bratsky_listok_primary_page_map_stage20_2026-07-31.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/bratsky_listok_primary_page_map_stage21_2026-07-31.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PRIMARY_PAGE_MAP_STAGE22_2026-08-01.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PRIMARY_PAGE_MAP_STAGE23_2026-08-01.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PRIMARY_PAGE_MAP_STAGE24_2026-08-01.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PRIMARY_PAGE_MAP_STAGE25_2026-08-01.csv.gz.b64"
      - ".github/workflows/bratsky-listok-authority-manifest.yml"
  push:
    branches: [main]
    paths:
      - "data/repository-evidence-policy-v2.json"
      - "data/bratsky-listok-authority-manifest.json"
      - "data/bratsky-listok-publication-ledger.json"
      - "scripts/validate_bratsky_listok_authority_manifest.py"
      - "RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PUBLICATION_AUTHORITY_2026-08-01.md"
      - "RUSSIAN_BAPTISTS_ARCHIVE/bratsky_listok_primary_page_map_stage18_2026-07-31.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/bratsky_listok_primary_page_map_stage19_2026-07-31.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/bratsky_listok_primary_page_map_stage20_2026-07-31.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/bratsky_listok_primary_page_map_stage21_2026-07-31.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PRIMARY_PAGE_MAP_STAGE22_2026-08-01.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PRIMARY_PAGE_MAP_STAGE23_2026-08-01.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PRIMARY_PAGE_MAP_STAGE24_2026-08-01.csv"
      - "RUSSIAN_BAPTISTS_ARCHIVE/BRATSKY_LISTOK_PRIMARY_PAGE_MAP_STAGE25_2026-08-01.csv.gz.b64"
      - ".github/workflows/bratsky-listok-authority-manifest.yml"

permissions:
  contents: read

jobs:
  authority-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history for commit:path verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Compile validator
        run: python3 -m py_compile scripts/validate_bratsky_listok_authority_manifest.py
      - name: Validate authority, historical blobs and publication boundary
        run: python3 scripts/validate_bratsky_listok_authority_manifest.py
      - name: Ensure validator is read-only
        run: git diff --exit-code
