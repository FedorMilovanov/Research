name: Build identity-scoped poet portrait review candidates v4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-poet-portrait-review-candidates.yml'
      - 'SOURCE_LIBRARY/tools/build_poet_portrait_review_candidates.py'
      - 'SOURCE_LIBRARY/tools/build_poet_portrait_review_candidates_v2.py'
      - 'SOURCE_LIBRARY/tools/build_poet_portrait_review_candidates_v3.py'
      - 'SOURCE_LIBRARY/tools/build_poet_portrait_review_candidates_v4.py'
      - 'SOURCE_LIBRARY/POET_PORTRAIT_REVIEW_WORKFLOW_2026-07-30.md'
      - 'requirements/source-audit.lock'
      - 'data/artifact-custody-policy-v2.json'

permissions:
  contents: read

jobs:
  build-review-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements/source-audit.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/source-audit.lock
      - name: Compile builders
        run: python -m py_compile SOURCE_LIBRARY/tools/build_poet_portrait_review_candidates*.py
      - name: Build identity-scoped review candidates
        run: >-
          python SOURCE_LIBRARY/tools/build_poet_portrait_review_candidates_v4.py
          --depth 3 --category-limit 250 --exact-search-limit 50
          --per-person 10 --minimum-ready 70 --minimum-core 1
          --output portrait-review-v2-output
      - name: Validate output and record temporary custody
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('portrait-review-v2-output')
          data = json.loads((root / 'portrait-v2-candidates.json').read_text(encoding='utf-8'))
          if data['review_ready'] < 70:
              raise SystemExit(f"review-ready gate failed: {data['review_ready']}")
          (root / 'CUSTODY.json').write_text(json.dumps({
              'state': 'EPHEMERAL_ACTION_ARTIFACT',
              'publicationEligible': False,
              'identityDecision': 'HUMAN_REVIEW_REQUIRED',
              'retentionDays': 30,
              'durableReceiptPresent': False,
              'policy': 'data/artifact-custody-policy-v2.json'
          }, indent=2), encoding='utf-8')
          PY
      - name: Add reproducibility witnesses
        run: |
          git rev-parse HEAD > portrait-review-v2-output/RESEARCH_COMMIT.txt
          python -m pip freeze > portrait-review-v2-output/PIP_FREEZE.txt
          sha256sum requirements/source-audit.lock > portrait-review-v2-output/DEPENDENCY_LOCK_SHA256.txt
      - name: Upload temporary review package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ephemeral-poet-portrait-review-v4
          path: portrait-review-v2-output/
          if-no-files-found: error
          retention-days: 30
      - name: Ensure builders are read-only
        run: git diff --exit-code
