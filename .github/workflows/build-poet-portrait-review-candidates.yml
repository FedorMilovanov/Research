name: Build poet portrait review candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-poet-portrait-review-candidates.yml'
      - 'SOURCE_LIBRARY/tools/build_poet_portrait_review_candidates.py'
      - 'SOURCE_LIBRARY/POET_PORTRAIT_REVIEW_WORKFLOW_2026-07-30.md'

permissions:
  contents: read

concurrency:
  group: poet-portrait-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-review-package:
    name: Build category-based portrait contact sheets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Build review candidates and contact sheets
        run: >-
          python SOURCE_LIBRARY/tools/build_poet_portrait_review_candidates.py
          --category-limit 150
          --search-limit 50
          --per-person 8
          --minimum-ready 70
          --output portrait-review-output

      - name: Publish summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open('portrait-review-output/portrait-candidates.json', encoding='utf-8'))
          print('# Poet portrait review candidates')
          print(f"- review-ready thumbnails: **{data['review_ready']}**")
          print(f"- people: **{len(data['people'])}**")
          print(f"- by person: `{data['review_ready_by_person']}`")
          print(f"- status counts: `{data['status_counts']}`")
          print(f"- contact sheets: `{data['contact_sheets']}`")
          PY

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: poet-portrait-review-candidates
          path: portrait-review-output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
