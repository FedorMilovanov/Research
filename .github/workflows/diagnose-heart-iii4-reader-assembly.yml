name: Diagnose Heart III.4 reader assembly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-heart-iii4-reader-assembly.yml'
      - 'scripts/diagnose_heart_iii4_reader_assembly.py'
      - 'СЕРИЯ СЕРДЦЕ/125_READER_CHAPTER_III4_HEART_AND_SPIRIT_2026-08-04.md'

permissions:
  contents: read

concurrency:
  group: diagnose-heart-iii4-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout Research
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: Research
          persist-credentials: false

      - name: Checkout exact Product snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FedorMilovanov/gb-is-my-strength
          ref: 0fbe7d1ead9ebd1bea867418e254da438ec63329
          path: Product
          persist-credentials: false

      - name: Compile diagnostic without writing bytecode
        working-directory: Research
        run: python3 -c 'from pathlib import Path; p=Path("scripts/diagnose_heart_iii4_reader_assembly.py"); compile(p.read_text(encoding="utf-8"), str(p), "exec")'

      - name: Build exact III.4 reader diagnostic
        working-directory: Research
        run: python3 scripts/diagnose_heart_iii4_reader_assembly.py --product-root ../Product

      - name: Upload exact diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heart-iii4-reader-diagnostic
          path: Research/iii4-reader-diagnostic.json
          if-no-files-found: error
          retention-days: 2

      - name: Remove diagnostic output
        working-directory: Research
        run: rm -f iii4-reader-diagnostic.json

      - name: Ensure source checkouts remain read-only
        run: |
          git -C Research diff --exit-code
          test -z "$(git -C Research status --porcelain)"
          git -C Product diff --exit-code
          test -z "$(git -C Product status --porcelain)"
