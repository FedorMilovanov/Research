name: Heart reader assembly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/heart-reader-assembly.yml'
      - 'data/heart-reader-assembly-2026-08-02.json'
      - 'data/heart-p0-architecture-dossiers-2026-08-02.json'
      - 'data/heart-whole-book-integration-2026-08-04.json'
      - 'scripts/validate_heart_reader_assembly.py'
      - 'scripts/validate_heart_p0_dossiers.py'
      - 'scripts/validate_heart_whole_book_integration.py'
      - 'СЕРИЯ СЕРДЦЕ/00_CURRENT_AUTHORITY_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/00_CURRENT_AUTHORITY_2026-08-04.md'
      - 'СЕРИЯ СЕРДЦЕ/74_SOURCE_CLOSURE_REGISTRY_2026-08-01.json'
      - 'СЕРИЯ СЕРДЦЕ/75_P0_EDEN_HEART_CREATED_AND_FALLEN_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/76_P0_BROKEN_HEART_REPENTANCE_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/77_P0_JUDGMENT_TWO_RESURRECTIONS_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/79_READER_CHAPTER_I2_HEART_IN_EDEN_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/80_READER_CHAPTER_III3_BROKEN_HEART_REPENTANCE_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/81_READER_CHAPTER_X1_JUDGMENT_TWO_RESURRECTIONS_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/82_BOOK_ASSEMBLY_DECISIONS_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/83_WHOLE_BOOK_INTEGRATION_MANIFEST_2026-08-04.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/heart-reader-assembly.yml'
      - 'data/heart-reader-assembly-2026-08-02.json'
      - 'data/heart-p0-architecture-dossiers-2026-08-02.json'
      - 'data/heart-whole-book-integration-2026-08-04.json'
      - 'scripts/validate_heart_reader_assembly.py'
      - 'scripts/validate_heart_p0_dossiers.py'
      - 'scripts/validate_heart_whole_book_integration.py'
      - 'СЕРИЯ СЕРДЦЕ/00_CURRENT_AUTHORITY_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/00_CURRENT_AUTHORITY_2026-08-04.md'
      - 'СЕРИЯ СЕРДЦЕ/74_SOURCE_CLOSURE_REGISTRY_2026-08-01.json'
      - 'СЕРИЯ СЕРДЦЕ/75_P0_EDEN_HEART_CREATED_AND_FALLEN_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/76_P0_BROKEN_HEART_REPENTANCE_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/77_P0_JUDGMENT_TWO_RESURRECTIONS_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/79_READER_CHAPTER_I2_HEART_IN_EDEN_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/80_READER_CHAPTER_III3_BROKEN_HEART_REPENTANCE_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/81_READER_CHAPTER_X1_JUDGMENT_TWO_RESURRECTIONS_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/82_BOOK_ASSEMBLY_DECISIONS_2026-08-02.md'
      - 'СЕРИЯ СЕРДЦЕ/83_WHOLE_BOOK_INTEGRATION_MANIFEST_2026-08-04.md'

permissions:
  contents: read

concurrency:
  group: heart-reader-assembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Research
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: Research
          persist-credentials: false

      - name: Checkout exact Product snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FedorMilovanov/gb-is-my-strength
          ref: 0fbe7d1ead9ebd1bea867418e254da438ec63329
          path: Product
          persist-credentials: false

      - name: Validate Python syntax without writing bytecode
        working-directory: Research
        run: |
          for path in \
            scripts/validate_heart_p0_dossiers.py \
            scripts/validate_heart_reader_assembly.py \
            scripts/validate_heart_whole_book_integration.py
          do
            python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); compile(p.read_text(encoding="utf-8"), str(p), "exec")' "$path"
          done

      - name: Preserve evidence authority
        working-directory: Research
        run: python3 scripts/validate_heart_p0_dossiers.py

      - name: Validate reader chapters and final order
        working-directory: Research
        run: python3 scripts/validate_heart_reader_assembly.py

      - name: Validate whole-book owner and citation mapping
        working-directory: Research
        run: python3 scripts/validate_heart_whole_book_integration.py --product-root ../Product

      - name: Ensure validators and exact Product witness are read-only
        run: |
          git -C Research diff --exit-code
          test -z "$(git -C Research status --porcelain)"
          git -C Product diff --exit-code
          test -z "$(git -C Product status --porcelain)"
