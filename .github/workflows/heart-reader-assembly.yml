name: Heart reader assembly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/heart-reader-assembly.yml'
      - 'data/heart-*.json'
      - 'data/heart-whole-book-citation-inventory-2026-08-04*'
      - 'scripts/validate_heart_*.py'
      - 'scripts/build_heart_whole_book_citation_inventory.py'
      - 'СЕРИЯ СЕРДЦЕ/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/heart-reader-assembly.yml'
      - 'data/heart-*.json'
      - 'data/heart-whole-book-citation-inventory-2026-08-04*'
      - 'scripts/validate_heart_*.py'
      - 'scripts/build_heart_whole_book_citation_inventory.py'
      - 'СЕРИЯ СЕРДЦЕ/**'

permissions:
  contents: read

concurrency:
  group: heart-reader-assembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout Research
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: Research
          persist-credentials: false

      - name: Checkout exact Product snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FedorMilovanov/gb-is-my-strength
          ref: 0fbe7d1ead9ebd1bea867418e254da438ec63329
          path: Product
          persist-credentials: false

      - name: Validate Python syntax without writing bytecode
        working-directory: Research
        run: |
          for path in \
            scripts/validate_heart_p0_dossiers.py \
            scripts/validate_heart_reader_assembly.py \
            scripts/validate_heart_whole_book_integration.py \
            scripts/validate_heart_vii_owner_closure.py \
            scripts/validate_heart_i4_owner_closure.py \
            scripts/validate_heart_x2_owner_closure.py \
            scripts/validate_heart_x3_owner_closure.py \
            scripts/validate_heart_x3_reader_assembly.py \
            scripts/build_heart_whole_book_citation_inventory.py \
            scripts/validate_heart_whole_book_citation_inventory.py \
            scripts/validate_heart_entry_citation_dispositions.py \
            scripts/validate_heart_i2_entry_citation_pass.py \
            scripts/validate_heart_iii3_entry_citation_pass.py \
            scripts/validate_heart_x1_entry_citation_pass.py \
            scripts/validate_heart_x3_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current.py \
            scripts/validate_heart_x2_reader_assembly.py \
            scripts/validate_heart_x2_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current_v2.py
          do
            python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); compile(p.read_text(encoding="utf-8"), str(p), "exec")' "$path"
          done

      - name: Preserve evidence authority
        working-directory: Research
        run: python3 scripts/validate_heart_p0_dossiers.py

      - name: Validate initial reader chapters and final order
        working-directory: Research
        run: python3 scripts/validate_heart_reader_assembly.py

      - name: Validate whole-book owner and citation mapping
        working-directory: Research
        run: python3 scripts/validate_heart_whole_book_integration.py --product-root ../Product

      - name: Validate chapter VII source-owner closure
        working-directory: Research
        run: python3 scripts/validate_heart_vii_owner_closure.py --product-root ../Product

      - name: Validate chapter I.4 source-owner closure
        working-directory: Research
        run: python3 scripts/validate_heart_i4_owner_closure.py --product-root ../Product

      - name: Validate chapter X.2 glorification source-owner closure
        working-directory: Research
        run: python3 scripts/validate_heart_x2_owner_closure.py --product-root ../Product

      - name: Validate chapter X.3 conclusion-section owner closure
        working-directory: Research
        run: python3 scripts/validate_heart_x3_owner_closure.py --product-root ../Product

      - name: Validate paraphrase-only X.3 final-book reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_x3_reader_assembly.py --product-root ../Product

      - name: Validate eighteen-entry citation/reference inventory
        working-directory: Research
        run: python3 scripts/validate_heart_whole_book_citation_inventory.py --product-root ../Product

      - name: Validate eighteen-entry citation disposition triage
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_dispositions.py --product-root ../Product

      - name: Validate completed I.2 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_i2_entry_citation_pass.py --product-root ../Product

      - name: Validate completed III.3 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_iii3_entry_citation_pass.py --product-root ../Product

      - name: Validate completed X.1 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_x1_entry_citation_pass.py --product-root ../Product

      - name: Validate completed X.3 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_x3_entry_citation_pass.py --product-root ../Product

      - name: Validate historical four-entry citation composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current.py

      - name: Validate paraphrase-only X.2 final-book reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_x2_reader_assembly.py --product-root ../Product

      - name: Validate completed X.2 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_x2_entry_citation_pass.py --product-root ../Product

      - name: Validate current five-entry citation composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current_v2.py

      - name: Build read-only I.4 reader assembly diagnostic
        working-directory: Research
        run: |
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          product_root = Path('../Product').resolve()
          builder_path = root / 'scripts/build_heart_whole_book_citation_inventory.py'
          spec = importlib.util.spec_from_file_location('builder', builder_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          sources = {
              'primary': {
                  'path': 'src/content/articles/serdce-i-telo.mdx',
                  'sectionIds': [
                      'telo-ne-vrag',
                      'chleny-oruzhie',
                      'hram-kuplennyj',
                      'zhivaya-zhertva',
                      'komfort-gospodin',
                      'ustalost',
                      'ne-hlebom-odnim',
                      'tverdo-ne-dubinkoy',
                      'kak-otlichit',
                      'vyhod',
                  ],
              },
              'support': {
                  'path': 'src/content/articles/chto-bibliya-nazyvaet-serdcem.mdx',
                  'sectionIds': ['vnutrenniy-chelovek', 'serdce-dusha-duh'],
              },
          }

          def section_row(text, section_id):
              scoped = module.extract_sections(text, [section_id])
              return {
                  'id': section_id,
                  'text': scoped,
                  'sha256': hashlib.sha256(scoped.encode('utf-8')).hexdigest(),
                  'bytes': len(scoped.encode('utf-8')),
                  'scriptureReferences': sorted({
                      module.normalize_ref(match.group(0))
                      for match in module.SCRIPTURE_RE.finditer(scoped)
                  }, key=str.casefold),
                  'externalLinks': sorted({
                      module.trim_url(match.group(0))
                      for match in module.URL_RE.finditer(scoped)
                  }, key=str.casefold),
                  'internalArticleLinks': sorted(set(module.ARTICLE_LINK_RE.findall(scoped))),
                  'inlineQuotationSegments': len(re.findall(r'«([^»\n]{8,})»', scoped)) + len(re.findall(r'“([^”\n]{8,})”', scoped)),
                  'markdownBlockquotes': sum(1 for line in scoped.splitlines() if re.match(r'^\s*>\s?\S', line)),
              }

          product_rows = {}
          for name, source in sources.items():
              path = product_root / source['path']
              text = path.read_text(encoding='utf-8')
              product_rows[name] = {
                  'path': source['path'],
                  'fullSha256': hashlib.sha256(text.encode('utf-8')).hexdigest(),
                  'sections': [section_row(text, section_id) for section_id in source['sectionIds']],
              }

          research_sources = {}
          for rel, markers in {
              'СЕРИЯ СЕРДЦЕ/60_V81_JAY_ADAMS_PRIMARY_SOURCE_DEEPENING.md': [
                  'Сердце — целостный внутренний человек',
                  'Остаточный грех как склонность и привычный принцип',
                  'Четыре свойства укоренившейся привычки',
                  'исторически описанной позицией автора',
              ],
              'СЕРИЯ СЕРДЦЕ/61_V82_PSYCHOTROPIC_MEDICATION_BODY_SOUL_BIBLICAL_COUNSELING.md': [
                  'Редукционизм 1 — человек есть только тело',
                  'Редукционизм 2 — тело почти не имеет значения',
                  'Писание обладает верховной, непогрешимой и достаточной властью',
                  'не назначает, не отменяет и не меняет дозировку',
              ],
          }.items():
              text = (root / rel).read_text(encoding='utf-8')
              research_sources[rel] = {
                  'sha256': hashlib.sha256(text.encode('utf-8')).hexdigest(),
                  'bytes': len(text.encode('utf-8')),
                  'markers': {marker: marker in text for marker in markers},
              }

          payload = {
              'productCommit': '0fbe7d1ead9ebd1bea867418e254da438ec63329',
              'productSources': product_rows,
              'researchSources': research_sources,
              'ownerClosure': json.loads((root / 'data/heart-i4-owner-closure-2026-08-04.json').read_text(encoding='utf-8')),
              'precedingCurrentV2': json.loads((root / 'data/heart-entry-citation-pass-current-v2-2026-08-04.json').read_text(encoding='utf-8')),
          }
          out = Path('/tmp/i4-reader-assembly-diagnostic.json')
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'primarySections': len(product_rows['primary']['sections']),
              'supportSections': len(product_rows['support']['sections']),
              'primaryBytes': sum(row['bytes'] for row in product_rows['primary']['sections']),
              'supportBytes': sum(row['bytes'] for row in product_rows['support']['sections']),
              'primaryRefs': len({ref for row in product_rows['primary']['sections'] for ref in row['scriptureReferences']}),
              'supportRefs': len({ref for row in product_rows['support']['sections'] for ref in row['scriptureReferences']}),
              'primaryQuotationSurfaces': sum(row['inlineQuotationSegments'] + row['markdownBlockquotes'] for row in product_rows['primary']['sections']),
              'supportQuotationSurfaces': sum(row['inlineQuotationSegments'] + row['markdownBlockquotes'] for row in product_rows['support']['sections']),
          }, ensure_ascii=False))
          PY

      - name: Upload read-only I.4 reader assembly diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i4-reader-assembly-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/i4-reader-assembly-diagnostic.json
          if-no-files-found: error
          retention-days: 1

      - name: Ensure validators and exact Product witness are read-only
        run: |
          git -C Research diff --exit-code
          test -z "$(git -C Research status --porcelain)"
          git -C Product diff --exit-code
          test -z "$(git -C Product status --porcelain)"
