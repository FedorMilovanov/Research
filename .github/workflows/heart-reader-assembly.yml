name: Heart reader assembly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/heart-reader-assembly.yml'
      - 'data/heart-*.json'
      - 'data/heart-whole-book-citation-inventory-2026-08-04*'
      - 'scripts/validate_heart_*.py'
      - 'scripts/build_heart_whole_book_citation_inventory.py'
      - 'СЕРИЯ СЕРДЦЕ/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/heart-reader-assembly.yml'
      - 'data/heart-*.json'
      - 'data/heart-whole-book-citation-inventory-2026-08-04*'
      - 'scripts/validate_heart_*.py'
      - 'scripts/build_heart_whole_book_citation_inventory.py'
      - 'СЕРИЯ СЕРДЦЕ/**'

permissions:
  contents: read

concurrency:
  group: heart-reader-assembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout Research
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: Research
          persist-credentials: false

      - name: Checkout exact Product snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FedorMilovanov/gb-is-my-strength
          ref: 0fbe7d1ead9ebd1bea867418e254da438ec63329
          path: Product
          persist-credentials: false

      - name: Validate Python syntax without writing bytecode
        working-directory: Research
        run: |
          for path in \
            scripts/validate_heart_p0_dossiers.py \
            scripts/validate_heart_reader_assembly.py \
            scripts/validate_heart_whole_book_integration.py \
            scripts/validate_heart_vii_owner_closure.py \
            scripts/validate_heart_i4_owner_closure.py \
            scripts/validate_heart_x2_owner_closure.py \
            scripts/validate_heart_x3_owner_closure.py \
            scripts/validate_heart_x3_reader_assembly.py \
            scripts/build_heart_whole_book_citation_inventory.py \
            scripts/validate_heart_whole_book_citation_inventory.py \
            scripts/validate_heart_entry_citation_dispositions.py \
            scripts/validate_heart_i2_entry_citation_pass.py \
            scripts/validate_heart_iii3_entry_citation_pass.py \
            scripts/validate_heart_x1_entry_citation_pass.py \
            scripts/validate_heart_x3_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current.py \
            scripts/validate_heart_x2_reader_assembly.py \
            scripts/validate_heart_x2_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current_v2.py \
            scripts/validate_heart_i4_reader_assembly.py \
            scripts/validate_heart_i4_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current_v3.py \
            scripts/validate_heart_i1_reader_assembly.py \
            scripts/validate_heart_i1_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current_v4.py \
            scripts/validate_heart_i3_reader_assembly.py \
            scripts/validate_heart_i3_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current_v5.py \
            scripts/validate_heart_part2_reader_assembly.py \
            scripts/validate_heart_part2_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current_v6.py \
            scripts/validate_heart_iii1_reader_assembly.py \
            scripts/validate_heart_iii1_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current_v7.py \
            scripts/validate_heart_iii2_reader_assembly.py \
            scripts/validate_heart_iii2_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current_v8.py \
            scripts/validate_heart_iii4_reader_assembly.py \
            scripts/validate_heart_iii4_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current_v9.py \
            scripts/validate_heart_part4_reader_assembly.py \
            scripts/validate_heart_part4_entry_citation_pass.py \
            scripts/validate_heart_entry_citation_pass_current_v10.py \
            scripts/validate_heart_part5_reader_assembly.py
          do
            python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); compile(p.read_text(encoding="utf-8"), str(p), "exec")' "$path"
          done

      - name: Preserve evidence authority
        working-directory: Research
        run: python3 scripts/validate_heart_p0_dossiers.py

      - name: Validate initial reader chapters and final order
        working-directory: Research
        run: python3 scripts/validate_heart_reader_assembly.py

      - name: Validate whole-book owner and citation mapping
        working-directory: Research
        run: python3 scripts/validate_heart_whole_book_integration.py --product-root ../Product

      - name: Validate chapter VII source-owner closure
        working-directory: Research
        run: python3 scripts/validate_heart_vii_owner_closure.py --product-root ../Product

      - name: Validate chapter I.4 source-owner closure
        working-directory: Research
        run: python3 scripts/validate_heart_i4_owner_closure.py --product-root ../Product

      - name: Validate chapter X.2 source-owner closure
        working-directory: Research
        run: python3 scripts/validate_heart_x2_owner_closure.py --product-root ../Product

      - name: Validate chapter X.3 source-owner closure
        working-directory: Research
        run: python3 scripts/validate_heart_x3_owner_closure.py --product-root ../Product

      - name: Validate X.3 reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_x3_reader_assembly.py --product-root ../Product

      - name: Validate whole-book citation inventory
        working-directory: Research
        run: python3 scripts/validate_heart_whole_book_citation_inventory.py --product-root ../Product

      - name: Validate entry citation dispositions
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_dispositions.py --product-root ../Product

      - name: Validate I.2 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_i2_entry_citation_pass.py --product-root ../Product

      - name: Validate III.3 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_iii3_entry_citation_pass.py --product-root ../Product

      - name: Validate X.1 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_x1_entry_citation_pass.py --product-root ../Product

      - name: Validate X.3 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_x3_entry_citation_pass.py --product-root ../Product

      - name: Validate historical four-entry composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current.py

      - name: Validate X.2 reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_x2_reader_assembly.py --product-root ../Product

      - name: Validate X.2 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_x2_entry_citation_pass.py --product-root ../Product

      - name: Validate historical five-entry composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current_v2.py

      - name: Validate I.4 reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_i4_reader_assembly.py --product-root ../Product

      - name: Validate I.4 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_i4_entry_citation_pass.py --product-root ../Product

      - name: Validate historical six-entry composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current_v3.py

      - name: Validate I.1 reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_i1_reader_assembly.py --product-root ../Product

      - name: Validate I.1 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_i1_entry_citation_pass.py --product-root ../Product

      - name: Validate historical seven-entry composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current_v4.py

      - name: Validate I.3 reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_i3_reader_assembly.py --product-root ../Product

      - name: Validate I.3 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_i3_entry_citation_pass.py --product-root ../Product

      - name: Validate historical eight-entry composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current_v5.py

      - name: Validate Part II reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_part2_reader_assembly.py --product-root ../Product

      - name: Validate Part II entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_part2_entry_citation_pass.py --product-root ../Product

      - name: Validate current nine-entry composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current_v6.py

      - name: Validate III.1 reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_iii1_reader_assembly.py --product-root ../Product

      - name: Validate III.1 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_iii1_entry_citation_pass.py --product-root ../Product

      - name: Validate current ten-entry composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current_v7.py

      - name: Validate III.2 reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_iii2_reader_assembly.py --product-root ../Product

      - name: Validate III.2 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_iii2_entry_citation_pass.py --product-root ../Product

      - name: Validate current eleven-entry composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current_v8.py

      - name: Validate III.4 reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_iii4_reader_assembly.py --product-root ../Product

      - name: Validate III.4 entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_iii4_entry_citation_pass.py --product-root ../Product

      - name: Validate current twelve-entry composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current_v9.py

      - name: Validate Part IV reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_part4_reader_assembly.py --product-root ../Product

      - name: Validate Part IV entry citation pass
        working-directory: Research
        run: python3 scripts/validate_heart_part4_entry_citation_pass.py --product-root ../Product

      - name: Validate current thirteen-entry composition
        working-directory: Research
        run: python3 scripts/validate_heart_entry_citation_pass_current_v10.py

      - name: Validate Part V reader assembly
        working-directory: Research
        run: python3 scripts/validate_heart_part5_reader_assembly.py --product-root ../Product

      - name: Ensure validators and exact Product witness are read-only
        run: |
          git -C Research diff --exit-code
          test -z "$(git -C Research status --porcelain)"
          git -C Product diff --exit-code
          test -z "$(git -C Product status --porcelain)"