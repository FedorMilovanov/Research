name: Audit ChatGPT Google Drive upload links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 2'
  pull_request:
    paths:
      - 'SOURCE_LIBRARY/tools/audit_google_drive_chatgpt_upload_links.py'
      - 'SOURCE_LIBRARY/processed/GOOGLE_DRIVE_UPLOAD_AUDIT_2026-07-30.md'
      - 'requirements/source-audit.lock'
      - '.github/workflows/audit-google-drive-upload-links.yml'
  push:
    branches: [main]
    paths:
      - 'SOURCE_LIBRARY/tools/audit_google_drive_chatgpt_upload_links.py'
      - 'requirements/source-audit.lock'
      - '.github/workflows/audit-google-drive-upload-links.yml'

permissions:
  contents: read

concurrency:
  group: google-drive-upload-link-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Check 46 official OpenAI and Google URLs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.8'
          cache: pip
          cache-dependency-path: requirements/source-audit.lock

      - name: Install hash-locked dependency set
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/source-audit.lock

      - name: Compile audit
        run: python -m py_compile SOURCE_LIBRARY/tools/audit_google_drive_chatgpt_upload_links.py

      - name: Run 46-link audit
        run: python SOURCE_LIBRARY/tools/audit_google_drive_chatgpt_upload_links.py

      - name: Enforce official-link health
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          rows = json.load(open('google-drive-upload-link-audit/results.json', encoding='utf-8'))
          counts = Counter(row['outcome'] for row in rows)
          bad_http = [row for row in rows if row['outcome'] == 'HTTP_ERROR']
          request_failed = [row for row in rows if row['outcome'] == 'REQUEST_FAILED']
          wrong_domain = [
              row for row in rows
              if row.get('final_url') and not any(
                  host in row['final_url']
                  for host in ('openai.com', 'google.com', 'googleapis.com')
              )
          ]
          if bad_http:
              raise SystemExit(f'official documentation HTTP errors: {len(bad_http)}')
          if len(request_failed) > 2:
              raise SystemExit(f'inconclusive audit: {len(request_failed)} request failures')
          if wrong_domain:
              raise SystemExit(f'unexpected redirect domains: {len(wrong_domain)}')
          print(dict(counts))
          PY

      - name: Publish summary
        run: cat google-drive-upload-link-audit/README.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record reproducibility metadata
        run: |
          git rev-parse HEAD > google-drive-upload-link-audit/RESEARCH_COMMIT.txt
          python -m pip freeze > google-drive-upload-link-audit/PIP_FREEZE.txt
          sha256sum requirements/source-audit.lock > google-drive-upload-link-audit/DEPENDENCY_LOCK_SHA256.txt

      - name: Ensure audit is read-only
        run: git diff --exit-code

      - name: Upload audit package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: google-drive-upload-46-link-audit
          path: google-drive-upload-link-audit/
          if-no-files-found: error
          retention-days: 30
