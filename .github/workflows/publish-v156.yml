name: Publish v156 microbatch

on:
  push:
    branches: [main]
    paths:
      - '.v156_parts/**'
      - '.github/workflows/publish-v156.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct, verify, and publish v156
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .v156_parts/part_00 ]; then
            echo 'v156 payload already consumed; nothing to do.'
            exit 0
          fi
          target='БАПТИСТЫ РОССИИ/baptists_v120_TRUE_GROUPED/data/NEXT_MICROBATCH.csv'
          tmp="${target}.tmp"
          cat .v156_parts/part_* | base64 --decode > "$tmp"
          test "$(wc -c < "$tmp" | tr -d ' ')" = '40570'
          echo '29e9471ec85a0ba13c3be8df49eda0ba2627b3ecd2c1d525b47c9e1daedc8db6  '"$tmp" | sha256sum -c -
          test "$(git hash-object "$tmp")" = '80faf9c5a0413abcae2fab73812b36b7fa918e49'
          mv "$tmp" "$target"
          rm -rf .v156_parts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'research(baptists): publish v156 microbatch'
          git push origin HEAD:main
