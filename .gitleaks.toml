# Конфиг gitleaks для репозитория Research: правила по умолчанию + узкий список
# разрешённых заглушек. Реестр этого репозитория — исследовательские документы,
# поэтому в истории много внешних URL, но ни один из них не должен содержать
# учётных данных.
#
# Главное правило: allowlist не должен становиться дырой.
# Здесь нет ни одного исключения по пути целиком (`tests/`, `docs/`, `fixtures/`),
# потому что настоящий токен чаще всего попадает в код именно в тесте — при отладке.
# Разрешены только конкретные образцы, которые проверены вручную.

[extend]
useDefault = true

[allowlist]
description = "Проверенные вручную заглушки. Каждая строка должна быть объяснена."

# Заглушки basic-auth в шаблоне конфигурации и в тестах маскирования.
regexes = [
  '''https?://user:pass@(?:127\.0\.0\.1|localhost|10\.0\.0\.1)(?::\d+)?''',
  '''bot123456:AAH''',
]

# Примеры ниже — заполнить под репозиторий и удалить неиспользуемое:
# paths = [
#   '''(^|/)tests/fixtures/fake_token\.json$''',
# ]

# Проверка после изменения этого файла:
#   gitleaks detect --source . --config .gitleaks.toml --redact -v
# И обязательно: убедиться, что добавленная строка не является настоящим секретом.
