name: Security baseline

# Единый защитный контур: секреты, зависимости, гигиена workflow.
# Все внешние действия прибиты к полному 40-символьному SHA — тот же принцип,
# что и в остальных workflow репозитория. Тег или ветка здесь недопустимы.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Каждый понедельник, 04:17 UTC — полная проверка истории, даже если кода не касались.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        if: ${{ hashFiles('requirements*.txt') != '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: pip-audit
        if: ${{ hashFiles('requirements*.txt') != '' }}
        run: |
          set -euo pipefail
          lock=""
          for f in requirements-lock.txt requirements.txt; do
            if [ -f "$f" ]; then lock="$f"; break; fi
          done
          echo "Auditing $lock"
          python -m pip install --quiet --upgrade pip pip-audit
          python -m pip_audit -r "$lock" --strict

      - name: Set up Node
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: npm audit
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          set -euo pipefail
          # Только high/critical: moderate-записи не должны валить гейт, иначе он станет шумом.
          npm audit --audit-level=high

  workflow-hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Enforce pinned actions and declared permissions
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys

          errors = []
          sha = re.compile(r"@[0-9a-f]{40}$")
          files = sorted(pathlib.Path(".github/workflows").glob("*.y*ml"))

          for path in files:
              text = path.read_text(encoding="utf-8")
              for line in text.splitlines():
                  stripped = line.strip()
                  if not stripped.startswith("uses:"):
                      continue
                  # Отсекаем хвостовой комментарий вида " # v7.0.1" — иначе якорь $ не сработает.
                  ref = stripped.split("uses:", 1)[1].split("#", 1)[0].strip().strip("'\"")
                  if ref.startswith("./"):
                      continue
                  if not sha.search(ref):
                      errors.append(f"{path}: action is not pinned to a 40-hex SHA: {ref}")
              if "permissions:" not in text:
                  errors.append(f"{path}: no top-level permissions block")
              if re.search(r"permissions:\s*write-all", text):
                  errors.append(f"{path}: permissions write-all is forbidden")
              if "pull_request_target" in text and "head.repo.full_name == github.repository" not in text:
                  errors.append(f"{path}: pull_request_target without fork guard")

          index = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          forbidden = (".env", "cookies.txt")
          for name in index:
              base = name.rsplit("/", 1)[-1]
              if base in forbidden or base.endswith((".pem", ".key", ".p12")):
                  errors.append(f"tracked secret-like file: {name}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK: {len(files)} workflow files, all actions pinned, permissions declared")
          PY

      - name: Verify no secret-shaped values in recent diff
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          # Грубая, но быстрая сеть на случай, если gitleaks недоступен (форк, лицензия).
          patterns = [
              re.compile(r"AIza[0-9A-Za-z_-]{35}"),                 # Google API key
              re.compile(r"gh[pousr]_[0-9A-Za-z]{36}"),             # GitHub token
              re.compile(r"\d{8,10}:[A-Za-z0-9_-]{35}"),            # Telegram bot token
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),    # private key
          ]
          try:
              diff = subprocess.run(
                  ["git", "log", "-p", "-1", "--unified=0"],
                  capture_output=True, text=True, check=True, timeout=120
              ).stdout
          except Exception as exc:  # noqa: BLE001 - диагностика важнее формы
              print(f"skipped: {exc}")
              sys.exit(0)

          hits = []
          for line in diff.splitlines():
              if line.startswith("+") and not line.startswith("+++"):
                  for pattern in patterns:
                      if pattern.search(line):
                          hits.append(pattern.pattern)
          if hits:
              print("possible secret-shaped strings in the last commit: " + ", ".join(sorted(set(hits))))
              sys.exit(1)
          print("OK: no secret-shaped strings in the last commit")
          PY
