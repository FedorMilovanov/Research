<title id="title">Биографии и богословские вопросы — общий исследовательский атлас</title>
<desc id="desc">Стрелка обозначает подписанный тип связи, не общее влияние. Серый пунктир — только навигация; оранжевый — фон. Все связи остаются исследовательскими.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="1400" height="980" fill="#f8fafc"/>
<text x="60" y="42" font-family="sans-serif" font-size="25" fill="#0f172a">Общий атлас: люди · тексты · темы · отделы</text>
<text x="60" y="70" font-family="sans-serif" font-size="16" fill="#475569">Исследовательская навигация — не доказательство влияния и не разрешение публикации</text>
<path data-type="TEACHER" d="M420 136 C465 136,465 336,510 336" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)"><title>sancroft-tuition · TEACHER: Обучение, по Wood. Не доказательство политического или богословского согласия; оригинал университетского регистра не получен.</title></path>
<path data-type="ACQUAINTANCE" d="M420 296 C465 296,465 336,510 336" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)"><title>johnson-acquaintance · ACQUAINTANCE: Знакомство, свидетельство Johnson. Около 1644 вычисляется от 1680; не точная дата начала дружбы.</title></path>
<path data-type="EDITORIAL_COMPARISON" d="M510 136 C465 136,465 456,420 456" fill="none" stroke="#be185d" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"><title>preston-comparison · EDITORIAL_COMPARISON: Редакторское сравнение. Не учитель Чарнока; оценка редакторов, не объективная метрика качества.</title></path>
<path data-type="EDITORIAL_CLAIM" d="M870 136 C915 136,915 136,960 136" fill="none" stroke="#be185d" stroke-width="2" marker-end="url(#arrow)"><title>manuscript-claim · EDITORIAL_CLAIM: Заявление о рукописях. Редакционное свидетельство о переписке; не независимая экспертиза рукописей.</title></path>
<path data-type="RECEPTION" d="M1140 300 C1140 300,1140 172,1140 172" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"><title>spurgeon-reception · RECEPTION: Выдержки: Psalm 103. Один антологический кейс; частичное совпадение и Condensed, не принятие всей системы. Исходные места p. 699 / p. 702.</title></path>
<path data-type="DOCTRINAL_TEXT" d="M870 336 C915 336,915 536,960 536" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"><title>providence-topic · DOCTRINAL_TEXT: Знание ради управления. Тезис автора, не доказанный механизм любого исторического события.</title></path>
<path data-type="CONTEXT" d="M420 616 C465 616,465 336,510 336" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"><title>emmanuel-context · CONTEXT: Университетская среда. Фон, не документ о партийной принадлежности Чарнока; Dillingham сменил Tuckney в 1653.</title></path>
<path data-type="CONTEXT" d="M690 580 C690 580,690 372,690 372" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"><title>regime-context · CONTEXT: Нормы режима, не личное действие. Не доказательство конкретной выплаты Чарноку или его участия в принуждении.</title></path>
<path data-type="NAVIGATION" d="M510 336 C465 336,465 826,420 826" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"><title>gill-nav · NAVIGATION: Другой биографический отдел. Только маршрут к владельцу. Не историческое влияние, не личный контакт и не новый доказанный факт; подробности в томе 07 Чарнока.</title></path>
<path data-type="NAVIGATION" d="M420 826 C465 826,465 826,510 826" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"><title>gill-reception-nav · NAVIGATION: Досье рецепции. Только маршрут к владельцу. Не историческое влияние, не личный контакт и не новый доказанный факт; подробности в томе 07 Чарнока.</title></path>
<path data-type="NAVIGATION" d="M960 336 C915 336,915 826,870 826" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"><title>shared-reception-nav · NAVIGATION: Сопоставить досье, не влияние. Только маршрут к владельцу. Не историческое влияние, не личный контакт и не новый доказанный факт; подробности в томе 07 Чарнока.</title></path>
<path data-type="NAVIGATION" d="M870 336 C915 336,915 736,960 736" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"><title>heart-nav · NAVIGATION: Ранее собранные употребления. Только маршрут к владельцу. Не историческое влияние, не личный контакт и не новый доказанный факт; подробности в томе 07 Чарнока.</title></path>
<path data-type="NAVIGATION" d="M870 336 C915 336,915 886,960 886" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"><title>apostasy-nav · NAVIGATION: Ранее собранные употребления. Только маршрут к владельцу. Не историческое влияние, не личный контакт и не новый доказанный факт; подробности в томе 07 Чарнока.</title></path>
<path data-type="RECEPTION" d="M870 456 C915 456,915 136,960 136" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"><title>hoek-critical-reception · RECEPTION: Критика и признание ценности. Одна статья2014;B1,частичный архив,не консенсус,не анахронический личный контакт;PUBLICATION_HOLD.</title></path>
